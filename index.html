<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101915">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Ronda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="El contador oficial de lo que bebe la cuadrilla.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B33D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z'/%3E%3Cpath d='M15 10h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2'/%3E%3Cpath d='M5 8a2.5 2.5 0 0 1 2.5-3 2.5 2.5 0 0 1 5 0A2.5 2.5 0 0 1 15 8'/%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>La Ronda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat+Brush&family=JetBrains+Mono:wght@500;700&family=Monoton&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: app de bar de barrio de noche — azulejo de fondo, posavasos, caña que se llena; El Burdel cambia a sala de neones. Columna única de 760px con barra de pestañas abajo */
:root{
  color-scheme: dark;
  --bg:#101915; --surface:#15201C; --surface-2:#1C2A24; --line:#2B3C34;
  --ink:#F4ECD8; --ink-2:#BDB8A5; --muted:#86918A;
  --amber:#F2B33D; --amber-deep:#BE8418; --foam:#FFF6E0; --red:#E45A3B;
  --on-accent:#1B1305;
  --tile:rgba(244,236,216,.035);
  --pink:#FF3CAC; --cyan:#2DE2E6; --yellow:#FFE45E;
  --font-display:'Bagel Fat One','Arial Black',Impact,system-ui,sans-serif;
  --font-body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-chalk:'Caveat Brush','Comic Sans MS','Chalkboard SE',cursive;
  --font-neon:'Monoton','Bagel Fat One','Arial Black',sans-serif;
  --r:18px;
}
body.neon{--bg:#0C0714; --surface:#150D22; --surface-2:#211533; --line:#3A2557; --muted:#9A88B3; --ink-2:#C9BCDB; --tile:rgba(255,60,172,.045)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);
  background-size:46px 46px;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background-color .5s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.35}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.screen{min-height:100%;padding-inline:16px}

/* ---------- GATE ---------- */
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:40px;text-align:center}
.cap{width:150px;height:150px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));animation:capIn .9s cubic-bezier(.2,1.4,.4,1) both}
.cap.shake{animation:shake .45s}
.cap.pop{animation:pop .7s cubic-bezier(.5,-0.4,.7,1) forwards}
@keyframes capIn{from{transform:translateY(-60px) rotate(-200deg) scale(.4);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-12px) rotate(-8deg)}40%,80%{transform:translateX(12px) rotate(8deg)}}
@keyframes pop{30%{transform:translateY(10px) scale(.95)}100%{transform:translateY(-120vh) rotate(720deg) scale(.6)}}
.logo{font-family:var(--font-display);font-size:clamp(56px,16vw,104px);line-height:.88;color:var(--amber);
  text-shadow:0 4px 0 var(--amber-deep),0 10px 30px rgba(242,179,61,.25);transform:rotate(-4deg)}
.logo span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:-1.1s}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}
.tag{color:var(--ink-2);max-width:30ch;margin:0 auto}
.coaster-form{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,100%)}
.coaster-input{width:100%;background:var(--surface);border:2px dashed var(--line);border-radius:999px;padding:16px 22px;
  text-align:center;font-size:18px;letter-spacing:.25em;transition:border-color .2s,transform .2s}
.coaster-input:focus{outline:none;border-color:var(--amber);border-style:solid;transform:scale(1.03)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--amber);color:var(--on-accent);font-weight:800;
  padding:14px 26px;border-radius:999px;box-shadow:0 5px 0 var(--amber-deep);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 5px 0 #0B120F}
.btn svg{width:18px;height:18px;flex:none}
.err{color:var(--red);min-height:1.4em;font-weight:600}
#pour{position:fixed;inset:0;z-index:50;pointer-events:none;transform:translateY(105%);background:var(--amber)}
#pour::before{content:"";position:absolute;left:-10%;right:-10%;top:-38px;height:40px;background:var(--foam);border-radius:50% 50% 0 0/100% 100% 0 0}
#pour.go{animation:pourUp 1.25s cubic-bezier(.6,0,.3,1) forwards}
@keyframes pourUp{0%{transform:translateY(105%)}45%{transform:translateY(0)}60%{transform:translateY(0)}100%{transform:translateY(-110%)}}

/* ---------- WHO ---------- */
#who{padding-block:36px 40px;max-width:760px;margin:0 auto}
.who-head{text-align:center;display:grid;gap:6px;margin-bottom:28px}
.who-head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,9vw,58px);color:var(--foam)}
.who-head p{color:var(--ink-2)}
.coasters{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px}
.coaster{aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--surface-2) 0 58%,var(--surface) 59% 100%);
  border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;
  box-shadow:0 10px 0 -2px #0B120F;animation:coasterIn .6s cubic-bezier(.2,1.5,.4,1) both;transition:transform .25s,border-color .25s}
.coaster::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px dashed rgba(244,236,216,.12)}
.coaster:hover{transform:rotate(-8deg) scale(1.05);border-color:var(--amber)}
.coaster:active{transform:scale(.94)}
.coaster .emo{font-size:44px;line-height:1}
.coaster .nm{font-weight:800;font-size:16px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coaster .sub{font-size:12px;color:var(--muted)}
.coaster.new{border-style:dashed;background:transparent;box-shadow:none}
.coaster.new .emo{color:var(--amber);font-family:var(--font-display);font-size:48px}
@keyframes coasterIn{from{transform:translateY(40px) rotate(25deg) scale(.6);opacity:0}}
.newform{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;animation:slideUp .35s ease both}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.txt{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.txt:focus{outline:none;border-color:var(--amber)}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:24px;border:1.5px solid var(--line);transition:transform .15s}
.emojis button[aria-pressed="true"]{border-color:var(--amber);background:var(--surface-2);transform:scale(1.12) rotate(-6deg)}
.picker{display:grid;gap:16px}
.prof-head{display:flex;gap:14px;align-items:center}
.prof-av{font-size:60px;line-height:1;flex:none;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);border:3px solid var(--amber)}
.prof-av .avx{font-size:60px}
.prof-head h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof-extra{border-top:1px solid var(--line);padding-top:14px}
.me-chip::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:2px;flex:none}
.crop-stage{margin:12px 16px 0;border-radius:18px;overflow:hidden;background:var(--bg);border:1px solid var(--line);touch-action:none}
.crop-stage canvas{display:block;width:100%;height:auto;aspect-ratio:1;cursor:grab;touch-action:none}
.crop-stage canvas:active{cursor:grabbing}
.crop-zoom{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink-2)}
.crop-zoom input{flex:1;accent-color:var(--amber)}
.selfie{background:linear-gradient(135deg,rgba(242,179,61,.14),transparent 60%),var(--bg);border:1.5px dashed var(--amber);border-radius:16px;padding:14px}
.selfie-head{display:flex;gap:12px;align-items:center}
.selfie-cam{font-size:40px;width:56px;height:56px;display:grid;place-items:center;flex:none;animation:wobble 2.6s ease-in-out infinite}
.selfie-cam .avx{font-size:48px}
.selfie b{font-size:15.5px}
.reto{font-family:var(--font-chalk);font-size:20px;color:var(--amber);line-height:1.2}
.reto .pop,#retoTxt.pop{display:inline-block;animation:pulse .45s}
.pick-sec{display:grid;gap:8px}
.pick-sec > .lbl{font-size:11.5px}
.emojis .artb{width:60px;height:60px;padding:3px;border-radius:50%;background:transparent}
.emojis .artb svg{width:100%;height:100%;display:block;border-radius:50%}
.emojis .artb:hover svg{animation:wobble .6s ease}
.emojis .artb[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber)}
.upl{cursor:pointer}
.upl-on{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;font-size:13.5px}
.upl-on .avx{font-size:36px}
.avx{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;border-radius:50%;overflow:hidden;object-fit:cover;flex:none}
.avx svg{width:100%;height:100%;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{color:var(--ink-2);text-align:center;padding:12px 0 22px}

/* ---------- APP SHELL ---------- */
#app{max-width:760px;margin:0 auto;padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:12px;background:linear-gradient(var(--bg) 70%,transparent)}
.mini-logo{font-family:var(--font-display);font-size:26px;color:var(--amber);transform:rotate(-4deg);text-shadow:0 2px 0 var(--amber-deep)}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;max-width:60vw}
.me-chip .e{font-size:22px;width:30px;height:30px;display:grid;place-items:center;background:var(--surface-2);border-radius:50%}
.me-chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.tabs-in{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:100%}
.tab{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;font-weight:600;color:var(--ink-2);transition:background .25s,color .25s;white-space:nowrap}
.tab svg{width:20px;height:20px;flex:none}
.tab[aria-selected="true"]{background:var(--amber);color:var(--on-accent)}
.tab[data-v="burdel"]{color:var(--pink)}
.tab[data-v="burdel"][aria-selected="true"]{background:var(--pink);color:#18051A;box-shadow:0 0 18px var(--pink)}
@media (max-width:640px){.tab{padding:10px 8px;font-size:13px}.tab span{display:none}.tab[aria-selected="true"] span{display:inline}}
.view{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
.sec{margin-top:30px;display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--foam)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.banner{background:rgba(228,90,59,.12);border:1px solid rgba(228,90,59,.4);color:var(--ink);border-radius:14px;padding:12px 14px;margin-top:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.seg{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg[aria-pressed="true"]{background:var(--foam);color:var(--on-accent);border-color:var(--foam)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;font-weight:600}
.chip .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#14100A}
.chip .dot svg{width:13px;height:13px}

/* ---------- MI BARRA ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:6px}
@media (max-width:460px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.glass{width:170px;max-width:100%;height:auto;overflow:visible}
.glass.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{30%{transform:scale(1.06,.95) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(1deg)}}
#liquid{transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.wave{animation:wave 3.4s linear infinite}
.wave.b{animation-duration:5.5s;animation-direction:reverse;opacity:.5}
@keyframes wave{to{transform:translateX(-120px)}}
.bub{animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-220px);opacity:0}}
.hero-stats{display:grid;gap:10px;min-width:0}
.bigpts{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
@media (max-width:460px){.bigpts{justify-content:center}}
.bigpts b{font-family:var(--font-display);font-weight:400;font-size:72px;line-height:.9;color:var(--foam)}
.bigpts small{color:var(--ink-2);font-weight:600}
.level{font-family:var(--font-chalk);font-size:26px;color:var(--amber);line-height:1.1}
.prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:100%;max-width:340px}
@media (max-width:460px){.prog{margin:0 auto}}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber-deep),var(--amber));transition:width .9s cubic-bezier(.3,1.4,.5,1)}
.hint{color:var(--ink-2);font-size:13.5px}
.tonight-chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:460px){.tonight-chips{justify-content:center}}

.drinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:540px){.drinks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drink{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;
  transition:border-color .2s;box-shadow:0 6px 0 -1px #0B120F}
.drink::before{content:"";position:absolute;inset:auto -20% -60% -20%;height:80%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.16;transition:opacity .25s,transform .4s;pointer-events:none}
.drink:hover{border-color:var(--c)}
.drink:hover::before{opacity:.32;transform:translateY(-10%)}
.drink-add{display:grid;gap:3px;text-align:left;padding:16px 14px 10px;position:relative;transition:transform .15s}
.drink-add:active{transform:scale(.95) rotate(-1deg)}
.drink .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#14100A;margin-bottom:6px;transition:transform .3s}
.drink:hover .ic{transform:rotate(-10deg) scale(1.08)}
.drink .ic svg{width:28px;height:28px}
.drink .dn{font-weight:800;font-size:16.5px;line-height:1.15}
.drink .ds{font-size:12.5px;color:var(--muted)}
.drink .dp{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 10px 10px;background:var(--bg);border-radius:999px;border:1px solid var(--line);position:relative}
.stepper button{height:40px;border-radius:999px;font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;transition:background .15s,transform .1s}
.stepper button:not(:disabled):hover{background:var(--surface-2)}
.stepper button:not(:disabled):active{transform:scale(.88)}
.stepper .plus{color:var(--c)}
.stepper .val{text-align:center;font-family:var(--font-mono);font-weight:700;font-size:17px}
.stepper .val.pulse{animation:pulse .45s}
@keyframes pulse{40%{transform:scale(1.6)}}
.water{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border:1.5px dashed var(--line);border-radius:var(--r);padding:10px 12px 10px 16px}
.water svg{width:26px;height:26px;color:#7CC4EE}
.water b{display:block}
.water span{font-size:12.5px;color:var(--muted)}
.water .stepper{margin:0;width:140px;--c:#7CC4EE}
@media (max-width:420px){.water{grid-template-columns:auto 1fr}.water .stepper{grid-column:1 / -1;width:100%}}
.fly{position:fixed;z-index:60;pointer-events:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#14100A}
.fly svg{width:24px;height:24px}
.log{display:grid}
.log-item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.log-item:last-child{border-bottom:0}
.log-item .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#14100A}
.log-item .dot svg{width:18px;height:18px}
.log-item .when{color:var(--muted);font-size:12.5px}
.log-item .p{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
.del{font-size:12.5px;padding:7px 12px;border-radius:99px;background:var(--surface-2);color:var(--ink);font-weight:600;white-space:nowrap}
.del:hover{background:var(--red);color:#fff}

/* ---------- MIS STATS ---------- */
.who-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.who-pick button{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap;flex:none}
.who-pick button[aria-pressed="true"]{border-color:var(--amber);background:var(--surface-2);color:var(--amber)}
.profile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.profile .big{font-size:56px;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:3px solid var(--amber);animation:spinIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes spinIn{from{transform:rotate(-180deg) scale(.4)}}
.profile h2{font-family:var(--font-display);font-weight:400;font-size:34px;color:var(--foam);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.kpi b{font-family:var(--font-mono);font-size:24px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{font-style:normal;font-size:12px;color:var(--ink-2)}
.party{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:slideUp .45s ease both;position:relative;overflow:hidden}
.party.first{border-color:var(--amber);background:linear-gradient(135deg,rgba(242,179,61,.12),transparent 55%),var(--surface)}
.party .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;color:var(--on-accent);background:#C9CDD2}
.party.first .medal{background:var(--amber);animation:wobble 2.6s ease-in-out infinite}
.party:nth-child(3) .medal{background:#C98A55}
.party:nth-child(n+4) .medal{background:var(--surface-2);color:var(--ink-2)}
@keyframes wobble{50%{transform:rotate(-12deg) scale(1.06)}}
.party .date{font-weight:800;font-size:17px}
.party .meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.party .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.party .score{text-align:right}
.party .score b{display:block;font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1;color:var(--foam)}
.party .score span{font-family:var(--font-chalk);font-size:18px;color:var(--amber)}
@media (max-width:460px){.party{grid-template-columns:auto 1fr}.party .score{grid-column:2;text-align:left;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}}
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.rec .dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#14100A}
.rec .dot svg{width:22px;height:22px}
.rec b{display:block;font-size:14.5px}
.rec span{font-size:12.5px;color:var(--muted)}
.vs{display:grid;gap:10px}
.vs-row{display:grid;grid-template-columns:80px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.vs-row .track{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.vs-row .track i{display:block;height:100%;border-radius:99px}
.vs-row b{font-family:var(--font-mono);text-align:right}

/* ---------- GRUPO ---------- */
.chart-card{display:grid;gap:10px}
.chart-card h3{font-size:16px;font-weight:800}
.chart-card p{color:var(--muted);font-size:13px;margin:0}
.chart-box{position:relative;height:260px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two > *{min-width:0}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font-body);font-weight:600}
tr.me td:first-child{color:var(--amber)}

/* ---------- TOP ---------- */
.board{background:#1A2420;border:10px solid #3A2A1A;border-radius:14px;padding:22px 18px 26px;box-shadow:inset 0 0 60px rgba(0,0,0,.5),0 10px 0 -2px #0B120F;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.05),transparent 60%);pointer-events:none}
.board h2{font-family:var(--font-chalk);font-weight:400;font-size:40px;color:var(--foam);text-align:center;transform:rotate(-2deg)}
.board .sub{text-align:center;font-family:var(--font-chalk);font-size:20px;color:var(--ink-2)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;margin-top:22px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .av{font-size:40px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:3px solid var(--line);position:relative}
.pod.p1 .av{width:84px;height:84px;font-size:50px;border-color:var(--amber)}
.pod .crown{position:absolute;top:-30px;left:50%;width:44px;transform:translateX(-50%) rotate(-12deg);animation:crown 2.2s ease-in-out infinite}
@keyframes crown{50%{transform:translateX(-50%) rotate(8deg) translateY(-4px)}}
.pod .pn{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.pod .pp{font-family:var(--font-mono);color:var(--amber);font-size:14px}
.pod .block{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--font-display);font-size:34px;color:var(--on-accent);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,1.4,.4,1) both}
.pod.p1 .block{height:120px;background:var(--amber);animation-delay:.35s}
.pod.p2 .block{height:86px;background:#C9CDD2;animation-delay:.15s}
.pod.p3 .block{height:62px;background:#C98A55;animation-delay:.5s}
@keyframes grow{from{transform:scaleY(0)}}
.rank{display:grid;gap:8px;margin-top:4px}
.rk{display:grid;grid-template-columns:34px auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;animation:slideUp .4s ease both}
.rk .pos{font-family:var(--font-display);font-size:22px;color:var(--muted);text-align:center}
.rk .e{font-size:28px}
.rk .who{min-width:0}
.rk .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .who span{font-family:var(--font-chalk);font-size:18px;color:var(--amber)}
.rk .sc{text-align:right}
.rk .sc b{display:block;font-family:var(--font-mono);font-size:20px}
.rk .sc span{font-size:12px;color:var(--muted)}
.rk.me{border-color:var(--amber)}
.bar-mini{height:4px;border-radius:9px;background:var(--surface-2);grid-column:2 / -1;overflow:hidden}
.bar-mini i{display:block;height:100%;background:var(--amber);border-radius:9px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.award{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;transition:transform .25s}
.award:hover{transform:translateY(-3px) rotate(-.6deg)}
.award .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#14100A;box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--line)}
.award .medal svg{width:24px;height:24px}
.award h3{font-family:var(--font-chalk);font-weight:400;font-size:24px;color:var(--foam);line-height:1.1}
.award .w{font-weight:800}
.award .why{color:var(--muted);font-size:13px}
.scale{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 18px;margin-top:6px}
.scale div{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-chalk);font-size:21px;color:var(--ink);border-bottom:1.5px dashed rgba(244,236,216,.18);padding-bottom:2px}
.scale div b{font-weight:400;color:var(--amber)}
.levels{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--font-chalk);font-size:18px;color:var(--ink-2);margin-top:12px;justify-content:center}

/* ---------- EL BURDEL ---------- */
.neon-wall{position:relative;border-radius:20px;padding:30px 16px 26px;text-align:center;overflow:hidden;border:1px solid var(--line);
  background:
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.35) 26px 28px),
    repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.35) 58px 60px),
    radial-gradient(ellipse at 50% 40%,#2A1440,#120A1E 70%)}
.neon-wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(255,60,172,.22),transparent 60%);pointer-events:none;animation:hum 4s ease-in-out infinite}
@keyframes hum{50%{opacity:.6}}
.sign{font-family:var(--font-neon);font-weight:400;line-height:1;color:#FFE1F2;position:relative;z-index:1}
.sign .el{display:block;font-size:clamp(22px,6vw,34px);color:#E8FDFF;letter-spacing:.3em;
  text-shadow:0 0 4px #fff,0 0 10px var(--cyan),0 0 22px var(--cyan),0 0 44px var(--cyan)}
.sign .bd{display:block;font-size:clamp(40px,13vw,86px);letter-spacing:.04em;margin-top:6px;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 26px var(--pink),0 0 52px var(--pink),0 0 90px var(--pink)}
.sign .bd span{display:inline-block}
.sign .flick{animation:flicker 5s linear infinite}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.18;text-shadow:none}}
.neon-tag{position:relative;z-index:1;margin-top:14px;color:var(--yellow);font-family:var(--font-chalk);font-size:21px;text-shadow:0 0 10px rgba(255,228,94,.6)}
.neon-heart{position:absolute;width:46px;z-index:1;filter:drop-shadow(0 0 6px var(--pink)) drop-shadow(0 0 14px var(--pink));animation:beat 1.4s ease-in-out infinite}
.neon-heart.l{left:16px;top:18px;rotate:-14deg} .neon-heart.r{right:16px;bottom:16px;width:36px;animation-delay:-.7s;filter:drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 14px var(--cyan))}
@keyframes beat{0%,100%{scale:1}15%{scale:1.18}30%{scale:1}45%{scale:1.1}}
.ncard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.ncard.glow{border-color:var(--pink);box-shadow:0 0 0 1px rgba(255,60,172,.3),0 0 26px rgba(255,60,172,.25),inset 0 0 26px rgba(255,60,172,.08)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status button{padding:14px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;display:grid;gap:2px;transition:all .25s}
.status button span{font-size:12px;font-weight:600;color:var(--muted)}
.status button[aria-pressed="true"]{border-color:var(--cyan);color:#E8FDFF;box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(45,226,230,.45);text-shadow:0 0 8px var(--cyan)}
.status button[aria-pressed="true"] span{color:var(--ink-2);text-shadow:none}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.act{border-radius:var(--r);border:1.5px solid var(--nc);background:var(--surface);overflow:hidden;display:grid;position:relative;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--nc) 30%,transparent),0 0 24px color-mix(in srgb,var(--nc) 22%,transparent)}
.act-add{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:16px;transition:transform .15s}
.act-add:not(:disabled):active{transform:scale(.96)}
.act .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--nc);border:2px solid var(--nc);
  box-shadow:0 0 12px var(--nc),inset 0 0 10px color-mix(in srgb,var(--nc) 40%,transparent)}
.act .ico svg{width:28px;height:28px;filter:drop-shadow(0 0 4px var(--nc))}
.act .an{font-weight:800;font-size:17px;line-height:1.15}
.act .as{font-size:12.5px;color:var(--muted)}
.act .ap{font-family:var(--font-neon);font-size:24px;color:var(--nc);text-shadow:0 0 10px var(--nc)}
.act .stepper{--c:var(--nc);margin:0 12px 12px}
.act .lock{font-size:12.5px;color:var(--yellow);padding:0 16px 10px;margin-top:-6px}
.assist-pick{display:grid;gap:10px;animation:slideUp .3s ease both}
.assist-pick .opts{display:flex;flex-wrap:wrap;gap:8px}
.assist-pick .opts button{padding:9px 14px;border-radius:999px;border:1.5px solid var(--cyan);color:#E8FDFF;font-weight:700;box-shadow:0 0 12px rgba(45,226,230,.3);transition:transform .15s,box-shadow .2s}
.assist-pick .opts button:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(45,226,230,.6)}
.tally{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center}
.tally b{font-family:var(--font-neon);font-weight:400;font-size:48px;color:#FFE1F2;text-shadow:0 0 10px var(--pink),0 0 26px var(--pink)}
.tally span{color:var(--ink-2)}
.nrank{display:grid;gap:8px}
.nrk{display:grid;grid-template-columns:34px auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);animation:slideUp .4s ease both}
.nrk.n1{border-color:var(--pink);box-shadow:0 0 20px rgba(255,60,172,.3)}
.nrk.me{outline:1.5px dashed var(--cyan);outline-offset:2px}
.nrk .pos{font-family:var(--font-neon);font-size:22px;color:var(--pink);text-shadow:0 0 8px var(--pink);text-align:center}
.nrk .e{font-size:28px}
.nrk .who{min-width:0}
.nrk .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrk .who span{font-size:12.5px;color:var(--muted)}
.nrk .sc{font-family:var(--font-mono);font-size:20px;font-weight:700;color:#FFE1F2;text-shadow:0 0 8px var(--pink)}
.nawards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.naward{border-radius:var(--r);padding:16px;border:1.5px solid var(--nc);background:var(--surface);display:grid;gap:4px;
  box-shadow:0 0 18px color-mix(in srgb,var(--nc) 25%,transparent);transition:transform .25s}
.naward:hover{transform:translateY(-3px) rotate(.6deg)}
.naward h3{font-family:var(--font-neon);font-weight:400;font-size:17px;letter-spacing:.04em;color:var(--nc);text-shadow:0 0 8px var(--nc);line-height:1.3}
.naward .w{font-weight:800}
.naward .why{font-size:13px;color:var(--muted)}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:8px}
.rule:last-child{border-bottom:0}
.rule b{font-weight:800}
.rule span{display:block;font-size:12.5px;color:var(--muted)}
.rule em{font-style:normal;font-family:var(--font-neon);font-size:22px;color:var(--yellow);text-shadow:0 0 8px rgba(255,228,94,.6)}
body.neon .seg[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#18051A;box-shadow:0 0 14px var(--pink)}
body.neon .mini-logo{color:var(--pink);text-shadow:0 0 10px var(--pink)}
body.neon .sec-h h2{color:#FFE1F2;text-shadow:0 0 10px rgba(255,60,172,.6)}

/* ---------- FICHAJES ---------- */
.fich{position:relative;border-radius:var(--r);padding:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:14px;overflow:hidden;isolation:isolate}
.fich-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtn{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:16px;border:1.5px solid var(--fc);
  background:color-mix(in srgb,var(--fc) 10%,var(--bg));transition:transform .15s,box-shadow .25s}
.fbtn:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 25%,transparent)}
.fbtn:active{transform:scale(.95)}
.fbtn .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--fc);color:#14100A}
.fbtn .fi svg{width:26px;height:26px}
.fbtn b{display:block;font-size:15.5px;line-height:1.15}
.fbtn span{font-size:12px;color:var(--muted)}
@media (max-width:420px){.fbtn{grid-template-columns:1fr;justify-items:start}}
.fich.on{border-color:transparent}
.fich.on::before{content:"";position:absolute;inset:-2px;z-index:-2;border-radius:inherit;background:conic-gradient(from var(--ang,0deg),var(--fc),transparent 30%,var(--fc) 50%,transparent 80%,var(--fc));animation:spinb 4s linear infinite}
.fich.on::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:calc(var(--r) - 2px);background:var(--surface)}
.fich.on.disco::before{background:conic-gradient(from var(--ang,0deg),#FF3CAC,#2DE2E6,#FFE45E,#9B72EA,#FF3CAC)}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinb{to{--ang:360deg}}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live .pulse-dot{width:12px;height:12px;border-radius:50%;background:var(--fc);box-shadow:0 0 0 0 var(--fc);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fc) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(40px,12vw,60px);line-height:1;color:var(--foam);letter-spacing:-.02em}
.fich-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{padding:10px 18px;font-size:14px}
.btn.out{background:var(--red);color:#fff;box-shadow:0 5px 0 #8E2E18}
.btn.out:active{box-shadow:0 1px 0 #8E2E18}
.early{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}
.early input{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px}
.warn{background:rgba(255,228,94,.1);border:1px solid rgba(255,228,94,.45);border-radius:12px;padding:10px 12px;font-size:13.5px}
.sess{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sess .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#14100A}
.sess .dot svg{width:18px;height:18px}
.sess .when{color:var(--muted);font-size:12.5px}
.sess .d{font-family:var(--font-mono);font-size:13.5px}
.inside{display:flex;gap:8px;flex-wrap:wrap}
.in-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--fc);font-size:13.5px;font-weight:600;
  box-shadow:0 0 14px color-mix(in srgb,var(--fc) 25%,transparent);animation:slideUp .4s ease both}
.in-chip .pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--fc);animation:ping 1.6s ease-out infinite}
.in-chip em{font-style:normal;font-family:var(--font-mono);color:var(--ink-2);font-size:12.5px}
.chron{display:grid;gap:4px}
.chron-day{font-family:var(--font-chalk);font-size:22px;color:var(--amber);margin-top:12px;padding-bottom:2px;border-bottom:1.5px dashed var(--line)}
.chron-day:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:44px auto 1fr;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.ev time{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.ev .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#14100A}
.ev .dot svg{width:16px;height:16px}
.ev span{min-width:0}

/* ---------- TUTORIAL ---------- */
#tuto,#avModal,#cropModal,#fotoModal,#rateModal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(5,10,8,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0}}
.tcard{width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:tpop .5s cubic-bezier(.2,1.5,.4,1) both;display:grid}
@keyframes tpop{from{transform:scale(.8) rotate(-3deg);opacity:0}}
.ttop{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.tstep{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.tskip{font-size:13.5px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:99px}
.tskip:hover{background:var(--surface-2)}
.tslide{display:grid;animation:tin .4s cubic-bezier(.2,1.2,.4,1) both}
.tslide.back{animation-name:tinb}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
@keyframes tinb{from{transform:translateX(-40px);opacity:0}}
.till{height:200px;margin:12px 16px 0;border-radius:18px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 60%,rgba(242,179,61,.18),transparent 70%),var(--bg);border:1px solid var(--line)}
.till.neon{background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.35) 22px 24px),repeating-linear-gradient(90deg,transparent 0 48px,rgba(0,0,0,.35) 48px 50px),radial-gradient(ellipse at 50% 45%,#2A1440,#120A1E 75%);border-color:#3A2557}
.tbody{padding:18px 20px 6px;display:grid;gap:8px}
.tbody h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;color:var(--foam)}
.tbody p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.5}
.tbody .joke{font-family:var(--font-chalk);font-size:20px;color:var(--amber);line-height:1.2}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 20px}
.tdots{display:flex;gap:6px}
.tdots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}
.tdots i.on{width:24px;background:var(--amber)}
.tnav{display:flex;gap:8px}
/* ilustraciones */
.t-glass{width:110px;height:auto;overflow:visible}
.t-liq{animation:tfill 3.2s cubic-bezier(.5,0,.3,1) infinite}
@keyframes tfill{0%{transform:translateY(180px)}70%,100%{transform:translateY(40px)}}
.t-emo{position:absolute;font-size:44px;right:22%;top:22%;animation:bob 2.4s ease-in-out infinite}
.t-mock{width:min(220px,80%);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;--c:#F2B33D}
.t-mock .row1{display:flex;align-items:center;gap:10px;padding:12px}
.t-mock .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#F2B33D;color:#14100A}
.t-mock .ic svg{width:24px;height:24px}
.t-mock .stepper{margin:0 10px 10px}
.t-mock .stepper .plus.tap{animation:tap .9s ease infinite}
@keyframes tap{0%,100%{transform:scale(1)}30%{transform:scale(.8);background:var(--surface-2)}}
.t-finger{position:absolute;font-size:30px;right:calc(50% - 120px);bottom:26px;animation:finger .9s ease infinite;pointer-events:none}
@keyframes finger{0%,100%{transform:translate(0,0)}30%{transform:translate(-4px,-6px) scale(.9)}}
.t-board{background:#1A2420;border:7px solid #3A2A1A;border-radius:10px;padding:10px 18px;width:min(250px,84%);display:grid;gap:3px;transform:rotate(-2deg)}
.t-board div{display:flex;justify-content:space-between;font-family:var(--font-chalk);font-size:20px;color:var(--ink);border-bottom:1.5px dashed rgba(244,236,216,.15)}
.t-board b{font-weight:400;color:var(--amber)}
.t-board div{animation:slideUp .4s ease both}
.t-prof{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:600}
.t-prof span{animation:slideUp .4s ease both}
.ttab{display:inline-flex;align-items:center;gap:6px;justify-self:start;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface-2);color:var(--amber);font-size:12.5px;font-weight:700}
.ttab svg{width:16px;height:16px}
.t-pod{display:flex;align-items:flex-end;gap:8px;height:150px}
.t-pod div{width:62px;display:grid;justify-items:center;gap:4px}
.t-pod span{font-size:30px}
.t-pod i{display:grid;place-items:center;width:100%;border-radius:8px 8px 0 0;font-family:var(--font-display);font-style:normal;color:var(--on-accent);transform-origin:bottom;animation:grow .8s cubic-bezier(.2,1.4,.4,1) both}
.t-sign{font-family:var(--font-neon);text-align:center;line-height:1}
.t-sign .el{display:block;font-size:20px;letter-spacing:.3em;color:#E8FDFF;text-shadow:0 0 4px #fff,0 0 10px var(--cyan),0 0 22px var(--cyan)}
.t-sign .bd{display:block;font-size:46px;color:#FFE1F2;margin-top:4px;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 26px var(--pink),0 0 52px var(--pink)}
.t-sign .flick{display:inline-block;animation:flicker 3s linear infinite}

#avModal{z-index:72}
#cropModal{z-index:90}
/* ---------- LA CUADRILLA ---------- */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
@media (max-width:420px){.crew{grid-template-columns:1fr}}
.mate{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  animation:slideUp .45s ease both;transition:transform .2s,border-color .2s;min-width:0}
.mate:hover{transform:translateY(-2px) rotate(-.4deg);border-color:var(--amber)}
.mate.me{border-color:var(--amber)}
.mate-av{position:relative;font-size:46px;width:62px;height:62px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);flex:none}
.mate-av .avx{font-size:52px}
.mate-live{position:absolute;right:0;bottom:2px;width:15px;height:15px;border-radius:50%;background:var(--fc);border:3px solid var(--surface);animation:ping 1.6s ease-out infinite}
.mate-body{display:grid;gap:3px;min-width:0}
.mate-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mate-top b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mate-top .pill{padding:1px 8px;font-size:11.5px}
.mate-frase{font-family:var(--font-chalk);font-size:19px;line-height:1.2;color:var(--amber)}
.mate-facts{font-size:12.5px;color:var(--muted)}
/* ---------- PRUEBAS DEL DELITO ---------- */
.ev-hero{position:relative;border-radius:20px;padding:22px 18px;overflow:hidden;border:1px solid var(--line);
  background:repeating-linear-gradient(-45deg,#1A1408 0 22px,#14100A 22px 44px)}
.ev-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0%,rgba(242,179,61,.18),transparent 60%);pointer-events:none}
.ev-tape{position:absolute;left:-30px;right:-30px;top:14px;height:28px;background:var(--yellow);color:#14100A;font-family:var(--font-display);font-size:14px;letter-spacing:.12em;
  display:flex;align-items:center;white-space:nowrap;overflow:hidden;transform:rotate(-3deg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ev-tape span{display:inline-block;padding-left:100%;animation:tape 18s linear infinite}
@keyframes tape{to{transform:translateX(-100%)}}
.ev-hero h2{position:relative;margin-top:44px;font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:.95;color:var(--foam);transform:rotate(-2deg);text-shadow:0 4px 0 #000}
.ev-hero p{position:relative;color:var(--ink-2);max-width:40ch;margin:10px 0 16px}
.ev-up{position:relative;display:flex;gap:10px;flex-wrap:wrap}
.ev-up .btn{cursor:pointer}
.podio-f{display:flex;justify-content:center;gap:10px;align-items:flex-end}
.podio-f .pf{display:grid;gap:6px;justify-items:center;min-width:0;flex:0 1 calc((100% - 20px) / 3)}
.podio-f .pf .frame{width:100%}
.podio-f .p1{order:2}.podio-f .p2{order:1}.podio-f .p3{order:3}
.podio-f .p1 .frame{transform:scale(1.04) rotate(-1deg)}
.pf-place{font-family:var(--font-display);font-size:22px;color:var(--amber);display:flex;align-items:center;gap:6px}
.pf-place svg{width:22px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px}
@media (max-width:420px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}}
.fcell{display:grid;gap:8px;min-width:0;animation:dropIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes dropIn{from{transform:translateY(-24px) rotate(-8deg);opacity:0}}
.fmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.fwho{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;font-weight:600}
.fwho span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fwho .avx{font-size:20px}
.like{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--font-mono);font-weight:700;font-size:14px;transition:transform .15s,background .2s,border-color .2s;flex:none;position:relative}
.like svg{width:18px;height:18px}
.like:active{transform:scale(.88)}
.like[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
.like.boom::after{content:"+1";position:absolute;left:50%;top:-6px;font-family:var(--font-display);color:var(--amber);animation:plus1 .8s ease-out forwards;pointer-events:none}
@keyframes plus1{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-34px) scale(1.4);opacity:0}}
.like.boom svg{animation:thumb .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes thumb{40%{transform:rotate(-25deg) scale(1.5)}}
/* marcos */
.frame{position:relative;display:block;width:100%;cursor:pointer;text-align:center;color:#1B1305;transition:transform .25s}
.frame:hover{transform:rotate(0deg) scale(1.02)!important}
.frame .ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#2B2620}
.frame .ph.loading{background:linear-gradient(110deg,#2B2620 30%,#3A342C 50%,#2B2620 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.frame .fcap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-polaroid{background:#FBF8F1;padding:8px 8px 0;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.f-polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-4deg);background:rgba(240,226,180,.75);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.f-polaroid .fcap{font-family:var(--font-chalk);font-size:18px;padding:6px 4px 10px;color:#2A2416}
.f-sebusca{background:#E8D3A2;padding:6px 8px 8px;border:2px solid #7A5A2A;box-shadow:0 10px 24px rgba(0,0,0,.45);background-image:radial-gradient(rgba(122,90,42,.18) 1px,transparent 1px);background-size:6px 6px}
.f-sebusca .hd{display:block;font-family:var(--font-display);font-size:clamp(18px,5vw,24px);color:#4A3110;letter-spacing:.06em;line-height:1.1;padding-bottom:4px}
.f-sebusca .ph{border:3px solid #4A3110;filter:sepia(.45) contrast(1.05)}
.f-sebusca .ft{display:block;font-size:11px;font-weight:800;color:#4A3110;text-transform:uppercase;letter-spacing:.08em;padding-top:5px}
.f-sebusca .fcap{font-family:var(--font-chalk);font-size:16px;color:#4A3110}
.f-prueba{background:rgba(220,235,240,.12);border:2px solid rgba(220,235,240,.35);border-radius:6px;padding:28px 8px 8px;backdrop-filter:blur(2px);box-shadow:inset 0 0 30px rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.45)}
.f-prueba::before{content:"";position:absolute;top:8px;left:8px;right:8px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#C23B3B 0 10px,#8E2525 10px 20px)}
.f-prueba .tag{position:absolute;left:10px;bottom:30px;background:#FBF8F1;color:#8E2525;border:2px solid #8E2525;font-family:var(--font-mono);font-size:10px;font-weight:700;padding:3px 6px;transform:rotate(-4deg);text-align:left;line-height:1.3;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.f-prueba .fcap{color:var(--ink);font-size:12.5px;padding-top:6px}
.f-museo{padding:12px;background:linear-gradient(135deg,#8A6414,#F2CF6B 25%,#9C7419 50%,#F7D97E 75%,#8A6414);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 0 0 3px #5E430C}
.f-museo .ph{border:6px solid #1B1305}
.f-museo .fcap{margin:8px auto 0;max-width:90%;background:linear-gradient(#E6C878,#B8913A);color:#2E2208;font-family:Georgia,serif;font-style:italic;font-size:12px;padding:3px 8px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.f-ficha{background:#1B1B1B;padding:8px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.f-ficha .wall{display:block;position:relative;background:repeating-linear-gradient(#D9D9D9 0 2px,#BFBFBF 2px 18px)}
.f-ficha .wall::after{content:"190 — 180 — 170 — 160";position:absolute;right:4px;top:6px;writing-mode:vertical-rl;font-family:var(--font-mono);font-size:8px;color:#333;letter-spacing:.2em}
.f-ficha .ph{filter:grayscale(.35) contrast(1.1)}
.f-ficha .placa{display:block;background:#111;color:#F4ECD8;font-family:var(--font-mono);font-size:10.5px;padding:6px 4px;line-height:1.35;letter-spacing:.06em}
.f-revista{background:#FFF;padding:0 0 6px;box-shadow:0 10px 24px rgba(0,0,0,.45);overflow:hidden}
.f-revista .mast{display:block;background:#E0242E;color:#fff;font-family:var(--font-display);font-size:clamp(17px,5vw,22px);letter-spacing:.02em;padding:4px 0}
.f-revista .burst{position:absolute;right:-6px;top:40px;width:62px;height:62px;display:grid;place-items:center;background:#FFE45E;color:#E0242E;font-family:var(--font-display);font-size:11px;line-height:1;transform:rotate(14deg);
  clip-path:polygon(50% 0,61% 18%,82% 10%,80% 32%,100% 40%,84% 56%,96% 76%,74% 78%,68% 100%,50% 86%,32% 100%,26% 78%,4% 76%,16% 56%,0 40%,20% 32%,18% 10%,39% 18%);animation:burst 2s ease-in-out infinite}
@keyframes burst{50%{transform:rotate(4deg) scale(1.08)}}
.f-revista .fcap{font-weight:800;font-size:13px;padding:6px 8px 0;color:#111}
/* subir */
.up-card .frame{max-width:260px;margin:14px auto 0}
.up-card .ph.develop{animation:develop 2.6s ease-out both}
@keyframes develop{0%{filter:brightness(2.4) sepia(1) blur(6px);opacity:.5}60%{filter:brightness(1.2) sepia(.4) blur(1px)}100%{filter:none}}
.frames-pick{display:flex;gap:6px;flex-wrap:wrap}
.frames-pick button{padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-weight:700;font-size:13px}
.frames-pick button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber);color:var(--on-accent)}
#fotoModal{z-index:74}
.lb .frame{max-width:340px;margin:12px auto 0;cursor:default}
.lb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.del.arm{background:var(--red);color:#fff}
/* ---------- LAS CRÓNICAS DE TABERNIA ---------- */
body.fantasy{--bg:#100E12; --surface:#1E1A16; --surface-2:#2A241D; --line:#4A3D2A; --muted:#A8977A; --ink-2:#D6C7A6; --tile:rgba(242,179,61,.03)}
body.fantasy .mini-logo{font-family:'Cinzel Decorative',Georgia,serif;font-size:20px;transform:none;text-shadow:0 0 12px rgba(242,179,61,.4)}
body.fantasy .sec-h h2{font-family:'Cinzel Decorative',Georgia,serif;font-weight:700;font-size:22px;color:#F1E2BC}
body.fantasy .tab[aria-selected="true"]{background:#C9A24A;color:#241805}
.tab-hero{position:relative;padding:28px 22px 24px;text-align:center;color:#3B2A14;border-radius:6px;
  background:radial-gradient(ellipse at 50% 40%,#F1E2BC 0%,#E3CB98 60%,#C9A86B 100%);box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 0 40px rgba(110,70,20,.35)}
.tab-hero::before,.tab-hero::after{content:"";position:absolute;left:-8px;right:-8px;height:18px;border-radius:9px;background:linear-gradient(#8A6A35,#C9A86B 40%,#7A5A28);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.tab-hero::before{top:-9px}.tab-hero::after{bottom:-9px}
.tab-hero h2{font-family:'Cinzel Decorative',Georgia,serif;font-weight:700;font-size:clamp(26px,8vw,40px);line-height:1.05;color:#3B2A14;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tab-hero p{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:17px;margin:10px auto 0;max-width:34ch;color:#5A4220}
.tab-hero .compass{width:64px;height:64px;margin:0 auto 6px;display:block;animation:spinSlow 30s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.tab-hero .tally{margin-top:14px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-family:'IM Fell English',Georgia,serif;font-size:16px;color:#3B2A14}
.tab-hero .tally b{font-family:'Cinzel Decorative',Georgia,serif;font-size:22px;display:block;line-height:1}
.realm-sub{font-family:'IM Fell English',Georgia,serif;font-style:italic;color:var(--ink-2);font-size:16px;margin-top:-8px}
.places{display:grid;gap:12px}
.place{border-radius:6px;color:#3B2A14;background:radial-gradient(ellipse at 30% 20%,#F1E2BC,#E2C995 70%,#D2B178);border:1px solid #8A6A35;
  box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 0 24px rgba(110,70,20,.25);animation:slideUp .45s ease both}
.place summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer}
.place summary::-webkit-details-marker{display:none}
.seal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;color:#FFF6E0;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rk) 70%,#fff),var(--rk) 55%,color-mix(in srgb,var(--rk) 60%,#000));
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.3)}
.seal::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:inherit;opacity:.55;z-index:-1;clip-path:polygon(50% 0,60% 8%,72% 3%,78% 14%,91% 13%,90% 26%,100% 33%,94% 44%,100% 56%,91% 63%,92% 77%,79% 80%,73% 92%,61% 89%,50% 100%,39% 89%,27% 92%,21% 80%,8% 77%,9% 63%,0 56%,6% 44%,0 33%,10% 26%,9% 13%,22% 14%,28% 3%,40% 8%)}
.seal b{font-family:'Cinzel Decorative',Georgia,serif;font-size:21px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.seal.none b{font-size:24px}
.pl-body{min-width:0;display:grid;gap:3px}
.pl-name{font-family:'Cinzel Decorative',Georgia,serif;font-weight:700;font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-rank{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:15px;color:var(--rkd)}
.pl-meta{font-size:12.5px;color:#6A5230}
.pl-who{display:flex;gap:2px;font-size:20px}
.pl-who .avx{font-size:22px}
.pl-chev{width:10px;height:10px;border-right:2px solid #6A5230;border-bottom:2px solid #6A5230;transform:rotate(45deg);transition:transform .25s;margin-right:4px}
.place[open] .pl-chev{transform:rotate(225deg)}
.pl-votes{padding:0 14px 12px;display:grid;gap:4px;border-top:1px dashed #8A6A35;padding-top:10px;margin:0 14px 0;padding-left:0;padding-right:0}
.pl-vote{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.pl-vote .avx{font-size:22px}
.pl-vote .n{font-family:'Cinzel Decorative',Georgia,serif;font-weight:700;font-size:16px}
.pl-vote small{color:#6A5230}
.ranks{display:flex;flex-wrap:wrap;gap:8px}
.ranks span{display:inline-flex;align-items:center;gap:6px;font-family:'IM Fell English',Georgia,serif;font-size:15px;color:var(--ink-2)}
.ranks i{width:12px;height:12px;border-radius:50%;background:var(--rk)}
.realm-empty{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:16px;color:var(--ink-2);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:8px}
/* nota al desfichar */
#rateModal{z-index:76}
.rate-card .tbody{text-align:center;justify-items:center}
.rate-card h2{font-size:26px}
.rate-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--fc);color:#14100A;animation:wobble 2s ease-in-out infinite}
.rate-ico svg{width:32px;height:32px}
.rate-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;margin-top:4px}
.rate-grid button{aspect-ratio:1;border-radius:14px;font-family:var(--font-display);font-size:24px;color:#14100A;background:var(--nc);box-shadow:0 4px 0 color-mix(in srgb,var(--nc) 55%,#000);transition:transform .12s}
.rate-grid button:active{transform:translateY(3px) scale(.94);box-shadow:0 1px 0 color-mix(in srgb,var(--nc) 55%,#000)}
.rate-sugg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rate-card .txt{text-align:center}
.nota-chip{min-width:34px;padding:5px 9px;border-radius:999px;font-family:var(--font-display);font-size:15px;color:#14100A;background:var(--nc)}
.t-scroll{width:min(250px,86%);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:6px;color:#3B2A14;background:radial-gradient(ellipse at 30% 20%,#F1E2BC,#E2C995 70%,#D2B178);box-shadow:0 8px 18px rgba(0,0,0,.45)}
/* ---------- LOS OKUPAS ---------- */
.okupa{display:grid;gap:12px;border-color:color-mix(in srgb,var(--fc) 45%,var(--line))}
.ok-head{display:flex;gap:12px;align-items:center}
.ok-head h3{font-size:16px;font-weight:800}
.ok-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--fc);color:#14100A;flex:none}
.ok-ico svg{width:24px;height:24px}
.ok-hero{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--fc) 12%,var(--bg));font-size:14.5px;line-height:1.35}
.ok-av{font-size:44px;line-height:1}
.ok-big{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--fc)}
.ok-quip{font-family:var(--font-chalk);font-size:18px;color:var(--amber);margin-top:2px}
.ok-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ok-list li{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center}
.ok-av2{font-size:24px;line-height:1}
.ok-list li.me .ok-name b{color:var(--amber)}
.ok-pos{font-family:var(--font-display);font-size:17px;color:var(--muted);text-align:center}
.ok-name{display:grid;gap:4px;min-width:0;font-size:14px}
.ok-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok-bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.ok-bar i{display:block;height:100%;border-radius:9px;background:var(--fc)}
.ok-t{font-family:var(--font-mono);font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
/* ---------- NOCHE 17-17 ---------- */
.night-chip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-self:start;padding:7px 12px 7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.night-chip svg{width:16px;height:16px;color:var(--amber);flex:none}
.night-chip em{font-style:normal;color:var(--muted);font-weight:500}
.night-chip em b{font-family:var(--font-body);font-weight:800;color:var(--amber)}
/* ---------- TOAST + STAMP ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;display:grid;justify-items:center;gap:8px;padding-inline:16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--foam);color:var(--on-accent);border-radius:999px;padding:10px 12px 10px 18px;font-weight:700;
  box-shadow:0 12px 30px rgba(0,0,0,.4);animation:toastIn .45s cubic-bezier(.2,1.6,.4,1) both;max-width:100%}
.toast.out{animation:toastOut .3s ease forwards}
.toast span{min-width:0}
.toast button{background:var(--on-accent);color:var(--foam);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
body.neon .toast{background:#FFE1F2;box-shadow:0 0 24px rgba(255,60,172,.6)}
@keyframes toastIn{from{transform:translateY(30px) scale(.8);opacity:0}}
@keyframes toastOut{to{transform:translateY(20px);opacity:0}}
#stamp{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
#stamp div{font-family:var(--font-display);font-size:clamp(40px,12vw,84px);color:var(--amber);border:8px solid var(--amber);border-radius:24px;padding:10px 26px;
  text-align:center;line-height:1;background:rgba(16,25,21,.85);animation:stamp 1.9s cubic-bezier(.2,1.5,.4,1) forwards;max-width:90vw}
#stamp div.neonst{font-family:var(--font-neon);color:#FFE1F2;border-color:var(--pink);background:rgba(12,7,20,.88);box-shadow:0 0 30px var(--pink),inset 0 0 30px rgba(255,60,172,.4);text-shadow:0 0 12px var(--pink)}
#stamp small{display:block;font-family:var(--font-body);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;font-weight:800;text-shadow:none}
@keyframes stamp{0%{transform:scale(3) rotate(-14deg);opacity:0}18%{transform:scale(1) rotate(-6deg);opacity:1}80%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(.9) rotate(-6deg);opacity:0}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function bindPicker(box, cur, onPick){

    try { const img = await loadImage(f); const url = await openCropper(img); if (!url) return; const v = 'img:' + url; bindPicker(box, v, onPick); onPick(v, true); }
    catch(err){ box.querySelector('.upl-err').textContent = err.message; }
  });
}
function loadImage(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Eso no parece una imagen.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('No se ha podido leer la imagen. Prueba con otra.'));
    fr.onload = () => { const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('No se ha podido abrir la imagen. Prueba con otra.'));
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function openCropper(img){
  return new Promise(resolve => {
    const box = $('#cropModal'); box.hidden = false;
    box.innerHTML = `<div class="tcard crop-card">
      <div class="ttop"><span class="tstep">Encuadra tu careto</span><button class="tskip" data-x>Cancelar</button></div>
      <div class="crop-stage"><canvas id="cropCv" width="560" height="560" aria-label="Vista previa de la foto recortada en círculo"></canvas></div>
      <div class="tbody" style="padding-top:12px">
        <div class="hint">Arrastra la foto para colocarla y usa la barra para acercarla.</div>
        <div class="crop-zoom"><span aria-hidden="true">−</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom"><span aria-hidden="true">+</span></div>
      </div>
      <div class="tfoot"><span class="hint">${esc(rand(['Esa cara vale oro.','Esto va directo al grupo.','Material de chantaje asegurado.']))}</span><button class="btn sm" data-ok>Usar esta foto</button></div></div>`;
    const cv = $('#cropCv'), ctx = cv.getContext('2d'), D = cv.width, R = D * 0.42;
    const base = Math.max(2*R / img.width, 2*R / img.height);
    let zoom = 1, ox = 0, oy = 0;
    const clamp = () => { const w = img.width * base * zoom, h = img.height * base * zoom; const mx = Math.max(0, (w - 2*R)/2), my = Math.max(0, (h - 2*R)/2); ox = Math.max(-mx, Math.min(mx, ox)); oy = Math.max(-my, Math.min(my, oy)); };
    const drawTo = (c, size, rad, withMask) => {
      const k = size / D, x = c.getContext('2d'); const w = img.width * base * zoom * k, h = img.height * base * zoom * k;
      x.fillStyle = '#101915'; x.fillRect(0, 0, size, size);
      x.drawImage(img, size/2 - w/2 + ox*k, size/2 - h/2 + oy*k, w, h);
      if (withMask){
        x.save(); x.fillStyle = 'rgba(8,12,10,.72)'; x.beginPath(); x.rect(0, 0, size, size); x.arc(size/2, size/2, rad, 0, Math.PI*2, true); x.fill('evenodd'); x.restore();
        x.save(); x.strokeStyle = '#F2B33D'; x.lineWidth = 6; x.setLineDash([18, 12]); x.beginPath(); x.arc(size/2, size/2, rad, 0, Math.PI*2); x.stroke(); x.restore();
      }
    };
    const draw = () => { clamp(); drawTo(cv, D, R, true); };
    draw();
    let drag = null;
    cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const r = cv.getBoundingClientRect(); drag = {x:e.clientX, y:e.clientY, ox, oy, k:D / r.width}; };
    cv.onpointermove = e => { if (!drag) return; ox = drag.ox + (e.clientX - drag.x) * drag.k; oy = drag.oy + (e.clientY - drag.y) * drag.k; draw(); };
    cv.onpointerup = cv.onpointercancel = () => { drag = null; };
    cv.onwheel = e => { e.preventDefault(); zoom = Math.max(1, Math.min(3, zoom - e.deltaY * 0.002)); $('#cropZoom').value = zoom; draw(); };
    $('#cropZoom').oninput = e => { zoom = Number(e.target.value); draw(); };
    const done = val => { box.hidden = true; box.innerHTML = ''; resolve(val); };
    box.querySelector('[data-x]').onclick = () => done(null);
    box.onclick = e => { if (e.target === box) done(null); };
    box.querySelector('[data-ok]').onclick = () => {
      const S = 200, out = document.createElement('canvas'); out.width = out.height = S;
      const k = S / (2*R), x = out.getContext('2d'); const w = img.width * base * zoom * k, h = img.height * base * zoom * k;
      x.fillStyle = '#101915'; x.fillRect(0, 0, S, S);
      x.drawImage(img, S/2 - w/2 + ox*k, S/2 - h/2 + oy*k, w, h);
      try {
        let q = .86, url = out.toDataURL('image/jpeg', q); while (url.length > 60000 && q > .4){ q -= .1; url = out.toDataURL('image/jpeg', q); }
        done(url);
      } catch(e){ box.querySelector('.tfoot .hint').textContent = 'No se ha podido recortar esta foto. Prueba con otra.'; }
    };
  });
}

function nightKey(ts){ const d = new Date(ts - NIGHT_CUTOFF_H*3600e3); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function fmtNightLong(k){ const dt = keyDate(k); return `${DAYS[dt.getDay()]} ${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`; }

function fmtDur(ms){ const m = Math.round(ms/60000); const h = Math.floor(m/60); return h ? `${h} h ${pad(m%60)} min` : `${m} min`; }
const fmtPts = p => (Math.round(p*10)/10).toLocaleString('es-ES', {maximumFractionDigits:1});

function mixColor(items){
  let r=0,g=0,b=0,w=0;
  items.forEach(it => { const d = DMAP[it.t]; if (!d || !d.pts) return; const x = d.pts;
    r += parseInt(d.c.slice(1,3),16)*x; g += parseInt(d.c.slice(3,5),16)*x; b += parseInt(d.c.slice(5,7),16)*x; w += x; });
  return w ? `rgb(${Math.round(r/w)},${Math.round(g/w)},${Math.round(b/w)})` : '#F2B33D';
}

const itemsOf = (coll, id) => pending[coll][id] || data[coll][id]?.items || [];
const person = id => people.find(p => p.id === id);
const ptsOf = list => list.reduce((s,d) => s + (DMAP[d.t]?.pts || 0), 0);
const bptsOf = list => list.reduce((s,d) => s + (BURDEL[d.t]?.pts || 0), 0);
const tonightKey = () => nightKey(Date.now());
const mineTonight = coll => flat(coll).filter(x => x.pid === me && x.night === tonightKey());
function nightBounds(k){ const st = keyDate(k); st.setHours(NIGHT_CUTOFF_H, 0, 0, 0); const en = new Date(st); en.setDate(en.getDate() + 1); return [st, en]; }
function nightRangeTxt(k){ const [st, en] = nightBounds(k); return `de ${DAYS[st.getDay()]} ${pad(NIGHT_CUTOFF_H)}:00 a ${DAYS[en.getDay()]} ${pad(NIGHT_CUTOFF_H)}:00`; }
function nightChip(k){ const en = nightBounds(k)[1].getTime(); const left = en - Date.now();
  return `<span class="night-chip" title="Cada noche de La Ronda va de ${pad(NIGHT_CUTOFF_H)}:00 a ${pad(NIGHT_CUTOFF_H)}:00 del día siguiente">${svgI('moon')}<span>Noche del ${fmtNight(k)} · ${nightRangeTxt(k)}</span>${left > 0 && k === tonightKey() ? `<em>cierra en <b data-close="${en}">${shortDur(left)}</b></em>` : ''}</span>`; }

(function drawCap(){
  const n = 21, R = 74, r = 64, cx = 80, cy = 80; let d = '';
  for (let i = 0; i < n*2; i++){ const a = Math.PI*2*i/(n*2) - Math.PI/2; const rr = i%2 ? r : R;
    d += (i ? 'L' : 'M') + (cx + rr*Math.cos(a)).toFixed(1) + ' ' + (cy + rr*Math.sin(a)).toFixed(1); }
  $('#cap').innerHTML = `<defs><radialGradient id="cg" cx="40%" cy="35%"><stop offset="0" stop-color="#FFD978"/><stop offset=".6" stop-color="#F2B33D"/><stop offset="1" stop-color="#9A6608"/></radialGradient></defs>
    <path d="${d}Z" fill="url(#cg)" stroke="#7A5005" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="80" cy="80" r="52" fill="none" stroke="#7A5005" stroke-width="2" opacity=".5"/>
    <text x="80" y="76" text-anchor="middle" font-family="Bagel Fat One, Arial Black, sans-serif" font-size="25" fill="#3A2603">LA</text>
    <text x="80" y="103" text-anchor="middle" font-family="Bagel Fat One, Arial Black, sans-serif" font-size="25" fill="#3A2603">RONDA</text>`;
})();
