const lastSession = () => allFich().filter(x => x.pid === me && Date.now() - x.ts < 14 * 86400e3).sort((a, b) => b.ts - a.ts)[0];
function openEditFich(){
  const s = lastSession(); if (!s || !canWrite()) return;
  const P = PLACES[s.t]; const box = $('#rateModal'); box.hidden = false;
  const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const outGuess = s.out || Math.min(Date.now(), s.ts + 3 * 3600e3);
  box.innerHTML = `<div class="tcard rate-card edit-card">
    <div class="ttop"><span class="tstep">Modificar fichaje</span><button class="tskip" data-x>Cancelar</button></div>
    <div class="tbody">
      <div class="rate-ico" style="--fc:${P.hi}">${svgI(s.t)}</div>
      <h2>${esc(s.place || P.n)}</h2>
      <div class="hint">${s.out ? 'Ajusta las horas a lo que estuviste de verdad.' : 'Sigues fichado. Pon a qué hora saliste y queda desfichado.'}</div>
      <div class="ef-grid">
        <label class="ef-f"><span>Entré a las</span><input type="time" id="efIn" value="${hm(s.ts)}"></label>
        <label class="ef-f"><span>Salí a las</span><input type="time" id="efOut" value="${hm(outGuess)}"></label>
      </div>
      <div class="ef-quick" role="group" aria-label="Duración rápida"><span class="lbl">O dime cuánto estuviste</span>
        <div class="row" style="justify-content:center;gap:6px">${[1,2,3,4,5,6].map(h => `<button type="button" class="seg" data-h="${h}">${h} h</button>`).join('')}</div></div>
      <div class="ef-total" id="efTot"></div>
      <div class="err" id="efErr" role="alert"></div>
      <div class="row" style="justify-content:center"><button class="btn sm" id="efSave">Guardar</button>${s.out ? '<button class="btn sm ghost" id="efOpen">Sigo dentro</button>' : ''}</div>
    </div></div>`;
  const close = () => { box.hidden = true; box.innerHTML = ''; };
  const calc = () => {
    const [ih, im] = $('#efIn').value.split(':').map(Number), [oh, om] = $('#efOut').value.split(':').map(Number);
    if ([ih, im, oh, om].some(isNaN)) return null;
    const a = new Date(s.ts); a.setHours(ih, im, 0, 0);
    if (a.getTime() - s.ts > 12 * 3600e3) a.setDate(a.getDate() - 1);
    if (s.ts - a.getTime() > 12 * 3600e3) a.setDate(a.getDate() + 1);
    const b = new Date(a); b.setHours(oh, om, 0, 0); if (b <= a) b.setDate(b.getDate() + 1);
    return [a.getTime(), b.getTime()];
  };
  const paint = () => { const r = calc(); const t = $('#efTot'); const e = $('#efErr'); e.textContent = '';
    if (!r) { t.textContent = ''; return; }
    t.innerHTML = `Total: <b>${fmtDur(r[1] - r[0])}</b> · de ${fmtTime(r[0])} a ${fmtTime(r[1])}`;
    if (r[1] > Date.now() + 60000) e.textContent = 'La hora de salida aún no ha llegado.'; };
  $('#efIn').oninput = $('#efOut').oninput = paint;
  box.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { const r = calc(); if (!r) return; $('#efOut').value = hm(Math.min(Date.now(), r[0] + Number(b.dataset.h) * 3600e3)); paint(); });
  box.querySelector('[data-x]').onclick = close;
  box.onclick = e => { if (e.target === box) close(); };
  $('#efSave').onclick = () => {
    const r = calc(); if (!r) return;
    if (r[1] > Date.now() + 60000){ $('#efErr').textContent = 'La hora de salida aún no ha llegado.'; return; }
    if (r[1] - r[0] < 60000){ $('#efErr').textContent = 'Tienes que haber estado al menos un minuto.'; return; }
    if (r[1] - r[0] > 20 * 3600e3){ $('#efErr').textContent = 'Más de 20 horas seguidas no cuela. Revisa las horas.'; return; }
    if (!canWrite()) return;
    setFields(s, {ts:r[0], out:r[1]}); close(); render();
    toast(`Fichaje corregido: ${fmtDur(r[1] - r[0])} ${P.en}`);
  };
  const op = $('#efOpen'); if (op) op.onclick = () => { if (!canWrite()) return; setOut(s, null); close(); render(); toast('Vale, sigues dentro. El reloj vuelve a correr.'); };
  paint();
}

function compressPhoto(img){
  let side = 900, q = .82, url = '';
  for (let tries = 0; tries < 8; tries++){
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    url = c.toDataURL('image/jpeg', q);
    if (url.length < 190000) return url;
    if (q > .55) q -= .1; else side = Math.round(side * .8);
  }
  return url;
}

function bjVal(cards){ let t = 0, aces = 0; cards.forEach(c => { const v = c.v === 1 ? 11 : Math.min(10, c.v); t += v; if (c.v === 1) aces++; }); while (t > 21 && aces){ t -= 10; aces--; } return {t, soft:aces > 0}; }
function mountBJ(){
  const box = $('#casGame');
  box.innerHTML = `<div class="ctable">
    <h3>Blackjack</h3><p class="crule">Una mano contra la banca. Acércate a 21 sin pasarte. La banca se planta en 17.</p>
    <div class="hand"><span class="hand-l" id="bjDL">Banca</span><div class="cards" id="bjD"></div></div>
    ${verdictHtml(bj.verdict, 'bjV')}
    <div class="hand"><div class="cards" id="bjP"></div><span class="hand-l" id="bjPL">Tú</span></div>
    <div class="cbtns" id="bjBtns"></div>

  bj.shownP = 0; bj.shownD = 0; paintBJ(true);
}
function paintBJ(all){
  const P = $('#bjP'), D = $('#bjD'); if (!P) return;
  const hideHole = bj.phase === 'player';

  const pv = bjVal(bj.p), dv = hideHole ? bjVal(bj.d.slice(0, 1)) : bjVal(bj.d);

  $('#bjDL').innerHTML = `Banca${bj.d.length ? `<b>${dv.t}${hideHole ? ' + ?' : ''}</b>` : ''}`;

function bjStand(){

function bjResolve(){
  const p = bjVal(bj.p).t, d = bjVal(bj.d).t, pBJ = p === 21 && bj.p.length === 2, dBJ = d === 21 && bj.d.length === 2;

const VD_LV = {s:{n:'Suave', ch:1, c:'#2E7D4F'}, p:{n:'Picante', ch:2, c:'#C4182C'}, m:{n:'Muy picante', ch:3, c:'#7A1030'}};
const vd = {lv:{s:true, p:true, m:false}, deck:[], i:-1, card:null, victim:true, who:null, lastWho:null};
function vdBuild(){
  const d = [];
  Object.keys(VD_LV).forEach(k => { if (vd.lv[k]) VERDAD[k].forEach((q, j) => d.push({k, q, id:k + j})); });
  for (let i = d.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  vd.deck = d; vd.i = -1; vd.card = null;
}
function vdPickWho(){
  const ps = people.filter(p => p.id !== vd.lastWho); if (!ps.length) return null;
  const p = ps[Math.floor(Math.random() * ps.length)]; vd.lastWho = p.id; return p.id;
}
function mountVerdad(){
  if (!vd.deck.length) vdBuild();
  const box = $('#casGame');
  box.innerHTML = `<div class="ctable">
    <h3>La Verdad</h3><p class="crule">Saca una carta y quien le toque responde. Con sinceridad, o bebe.</p>
    <div class="vd-lv" role="group" aria-label="Nivel de picante">${Object.entries(VD_LV).map(([k, v]) => `<button data-lv="${k}" aria-pressed="${vd.lv[k]}">${'🌶'.repeat(v.ch)} ${v.n}</button>`).join('')}</div>
    <div class="vd-stage" id="vdStage"><div class="vd-deck" aria-hidden="true"><i></i><i></i><i></i></div>${vd.card ? vdCardHtml(false) : ''}</div>
    <div class="vd-count" id="vdCount"></div>
    <div class="cbtns"><button class="cbtn" id="vdDraw">${vd.card ? 'Siguiente carta' : 'Sacar carta'}</button><button class="cbtn ghost" id="vdWho" aria-pressed="${vd.victim}">${vd.victim ? 'Elegir víctima: sí' : 'Elegir víctima: no'}</button></div>
  </div>`;
  box.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => {
    const k = b.dataset.lv; const next = {...vd.lv, [k]:!vd.lv[k]};
    if (!Object.values(next).some(Boolean)){ toast('Elige al menos un nivel de picante.'); return; }
    vd.lv = next; vdBuild(); mountVerdad();
  });
  $('#vdDraw').onclick = vdDraw;

  vdCount();
}
function vdCount(){ const e = $('#vdCount'); if (e) e.textContent = vd.i >= 0 ? `Carta ${vd.i + 1} de ${vd.deck.length}` : `${vd.deck.length} cartas en el mazo`; }
function vdCardHtml(anim){
  const c = vd.card, L = VD_LV[c.k], who = vd.who ? person(vd.who) : null;
  return `<div class="vd-card ${anim ? 'draw' : ''}" id="vdCard" style="--lvc:${L.c}">

function vdDraw(){

function hashStr(t){ let h = 2166136261; for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function frasesAsignadas(){
  // Cada persona recibe una frase fija, sin repetir dentro de la cuadrilla (por orden de llegada).
  const out = {}, used = new Set();
  [...people].sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id)).forEach(p => {
    let i = hashStr(p.id) % FRASES.length, n = 0;
    while (used.has(i) && n < FRASES.length){ i = (i + 1) % FRASES.length; n++; }
    used.add(i); out[p.id] = FRASES[i];
  });
  return out;
}

const CROWN = `<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="#F2B33D" stroke="#7A5005" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const periodFilter = r => { const nowK = tonightKey(); return {night: d => d.night === nowK, month: d => d.night.slice(0,7) === nowK.slice(0,7), all: () => true}[r]; };
function renderTop(){
  const el = $('#view');
  const nowK = tonightKey();
  const drinks = allDrinks().filter(periodFilter(topRange));
  const pids = people.map(p => p.id);
  const rows = pids.map(pid => { const l = drinks.filter(d => d.pid === pid); const alc = l.filter(d => d.t !== 'agua');
    const perNight = {}; alc.forEach(d => perNight[d.night] = (perNight[d.night]||0) + DMAP[d.t].pts);
    return {pid, p:person(pid), pts:ptsOf(l), n:alc.length, bestN:Math.max(0, ...Object.values(perNight))}; })
    .filter(r => r.n > 0).sort((a,b) => b.pts - a.pts || b.n - a.n);
  const rangeLbl = {night:'Esta noche', month:'Este mes', all:'Siempre'};
  const titleFor = r => topRange === 'night' ? LEVELS[levelFor(r.pts)][1] : LEVELS[levelFor(r.bestN)][1] + ' (su mejor noche)';
  const awards = [];
  const leader = (k, title, why) => { const c = pids.map(pid => [pid, drinks.filter(d => d.pid===pid && d.t===k).length]).sort((a,b) => b[1]-a[1]);
    if (c[0] && c[0][1] > 0) awards.push({title, who:person(c[0][0]), why:why.replace('#', c[0][1]), k}); };
  leader('cerveza','Barril humano','# cervezas. Respeto.');
  leader('chupito','Rey del chupito','# chupitos para dentro.');
  leader('copa','Mixólogo de barra','# copas. Hielo y fe.');
  leader('tinto','Embajador del tinto','# tintos de verano.');
  leader('vino','Sumiller de bareto','# vinos catados.');
  leader('otros','Explorador','# bebidas raras. Valiente.');
  leader('agua','Aquaman','# vasos de agua. El único con cabeza.');
  const fT = allFich().filter(periodFilter(topRange));
  [['bar','Okupa del bar','dentro de bares. Ya le cobran alquiler.'],['disco','Rey de la pista','en discotecas. No sale ni con agua caliente.']].forEach(([t, title, why]) => {
    const c = pids.map(pid => [pid, fT.filter(s => s.pid === pid && s.t === t).reduce((a,s) => a + sessDur(s), 0)]).sort((a,b) => b[1]-a[1])[0];
    if (c && c[1] > 0) awards.push({title, who:person(c[0]), why:`${shortDur(c[1])} ${why}`, k:t});
  });
  const nightRows = {}; drinks.filter(d => d.t !== 'agua').forEach(d => { const k = d.pid+'|'+d.night; nightRows[k] = (nightRows[k]||0) + DMAP[d.t].pts; });
  const legend = Object.entries(nightRows).sort((a,b) => b[1]-a[1])[0];
  if (legend){ const [pid, n] = legend[0].split('|'); if (person(pid)) awards.unshift({title:'Noche legendaria', who:person(pid), why:`${fmtPts(legend[1])} pts el ${fmtNight(n)}.`, k:'moon'}); }
  const late = drinks.filter(d => d.t !== 'agua').map(d => { const dt = new Date(d.ts); return [d, ((dt.getHours() - NIGHT_CUTOFF_H + 24) % 24) * 60 + dt.getMinutes()]; }).sort((a,b) => b[1]-a[1])[0];
  if (late && person(late[0].pid)) awards.push({title:'Cierra bares', who:person(late[0].pid), why:`Pidió a las ${fmtTime(late[0].ts)}. Nadie más aguantó.`, k:'clock'});
  const T = tavernTop(rows, drinks);
  const sub = topRange === 'night' ? 'Noche del ' + fmtNight(nowK) : topRange === 'month' ? 'Mes de ' + ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][Number(nowK.slice(5,7))-1] : 'Desde que abrió la taberna';
  el.innerHTML = `
    <div class="sec" style="margin-top:2px">
      <div class="tav-sign-wrap"><div class="tav-chains" aria-hidden="true"><i></i><i></i></div>
        <div class="tav-sign"><h2>El Top<br>de la Taberna</h2><small>${esc(sub)}</small></div></div>
      <div class="tav-filters" role="group" aria-label="Periodo">${Object.entries(rangeLbl).map(([k,v]) => `<button class="seg" data-r="${k}" aria-pressed="${topRange===k}">${v}</button>`).join('')}</div>
      ${rows.length ? T.barrels + T.sayings : `<div class="board" style="margin-top:14px"><p class="empty" style="font-family:var(--font-chalk);font-size:22px">${topRange === 'night' ? 'La taberna acaba de abrir. Aún no ha bebido nadie.' : 'Barriles vacíos. Que empiece la ronda.'}</p></div>`}
    </div>
    ${T.plaques}${T.parroquia}${T.bill}
    ${awards.length ? `<div class="sec"><div class="sec-h"><h2>Premios</h2><span class="eyebrow">${esc(rangeLbl[topRange])}</span></div>
      <div class="awards">${awards.map(a => { const d = DMAP[a.k] || PLACES[a.k]; return `<div class="award"><span class="medal" style="background:${d ? d.hi : '#F2B33D'}">${svgI(a.k)}</span><h3>${esc(a.title)}</h3><div class="w">${av(a.who)} ${esc(a.who.name)}</div><div class="why">${esc(a.why)}</div></div>`; }).join('')}</div></div>` : ''}
    <div class="sec board" style="padding-block:18px 22px">
      <h2 style="font-size:32px">Así puntúa el bar</h2>
      <div class="sub">Cuanto más fuerte, más puntos de pedo</div>
      <div class="scale">${[...DRINKS].sort((a,b) => b.pts - a.pts).map(d => `<div><span>${esc(d.n)}</span><b>${fmtPts(d.pts)}</b></div>`).join('')}<div><span>Agua</span><b>0</b></div></div>
      <div class="levels">${LEVELS.map(l => `<span>${l[0]}+ ${esc(l[1])}</span>`).join(' · ')}</div>
      <div class="sub" style="margin-top:14px">Cada noche va de las ${NIGHT_CUTOFF_H}:00 a las ${NIGHT_CUTOFF_H}:00 del día siguiente. Lo de las 4 de la mañana cuenta para la noche de antes.</div>
    </div>`;
  el.querySelectorAll('.seg').forEach(b => b.onclick = () => { topRange = b.dataset.r; render(); });
}

const TAV_TITLES = ['Rey de la Barra','Escudero del Grifo','Aprendiz de Borracho','Calientabancos','Sobrio de Guardia'];
const TAV_QUIPS = [
  ['El tabernero ya le guarda taburete.','Su hígado ha pedido la baja voluntaria.','Tiene más cuenta abierta que el bar.','Le llaman el Grifo Humano.','Los camareros le saludan por su nombre.'],
  ['A una ronda de la corona.','Bebe con ambición, pero le falta fe.','Plata en la barra, oro en la resaca.','Siempre el segundo. Como el pan.'],
  ['Bronce, que también brilla.','Promete. Su madre no está orgullosa.','Va bien, pero se toma su tiempo.','Último del podio, primero en pedir kebab.'],
  ['Ni podio ni vergüenza. Tibio.','Se pide agua entre ronda y ronda. Sospechoso.','Casi, pero no.'],
  ['Alguien tiene que conducir.','Bebe para socializar. Qué aburrido.','Viene por el ambiente, dice.']
];
const LITROS = {cerveza:.25, copa:.25, chupito:.04, tinto:.3, vino:.15, otros:.2, agua:0};
const tavQuip = (pid, i) => { const q = TAV_QUIPS[i]; return q[(hashStr(pid + topRange) + i) % q.length]; };
const FOAM_SVG = '<svg class="foam" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h10v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#F2B33D" stroke="#3A2603" stroke-width="1.4"/><path d="M15 10h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2" fill="none" stroke="#3A2603" stroke-width="1.6"/><path d="M4.5 8.5a2.5 2.5 0 0 1 3-3.4 2.6 2.6 0 0 1 5 0 2.4 2.4 0 0 1 3 3.4z" fill="#FFF6E0" stroke="#3A2603" stroke-width="1.2"/></svg>';
function tavernTop(rows, drinks){
  const favOf = pid => { const f = DRINKS.map(d => [d, drinks.filter(x => x.pid === pid && x.t === d.k).length]).sort((a,b) => b[1]-a[1])[0]; return f && f[1] ? f[0].n.toLowerCase() : null; };
  const top3 = rows.slice(0, 3), next = rows.slice(3, 5), rest = rows.slice(5);
  const barrels = `<div class="tav-stage"><div class="barrels">${[0,1,2].map(i => { const r = top3[i]; if (!r) return `<div class="bslot b${i+1}"></div>`;
      return `<div class="bslot b${i+1}"><div class="bav">${i === 0 ? CROWN : ''}${av(r.p)}${i === 0 ? FOAM_SVG : ''}</div>
        <div class="btitle">${TAV_TITLES[i]}</div><div class="bname">${esc(r.p.name)}</div>
        <div class="barrel">${i === 0 ? '<span class="drip"></span>' : ''}<b>${i+1}</b><span class="bpts">${fmtPts(r.pts)} pts</span></div></div>`; }).join('')}</div><div class="tav-floor"></div></div>`;
  const sayings = `<div class="sayings">${top3.map((r, i) => { const f = favOf(r.pid);
      return `<div class="saying" style="animation-delay:${i*90}ms"><span class="sp g${i+1}">${i+1}</span><span class="st"><b>${esc(r.p.name)}, ${TAV_TITLES[i]}</b><i>«${esc(tavQuip(r.pid, i))}»</i><span>${fmtPts(r.pts)} pts · ${plural(r.n,'bebida','bebidas')}${f ? ' · lo suyo: ' + esc(f) : ''}</span></span><span class="sav">${av(r.p)}</span></div>`; }).join('')}</div>`;
  const plaques = next.length ? `<div class="sec"><div class="sec-h"><h2>Placas de honor (más o menos)</h2></div><div class="plaques">${next.map((r, j) => { const i = j + 3;
      return `<div class="plaque" style="animation-delay:${j*90}ms"><span class="pp">${i+1}.º · ${TAV_TITLES[i]}</span><span class="pav">${av(r.p)}</span><b>${esc(r.p.name)}</b><i>«${esc(tavQuip(r.pid, i))}»</i><small>${fmtPts(r.pts)} pts</small></div>`; }).join('')}</div></div>` : '';
  const parroquia = rest.length ? `<div class="sec"><div class="sec-h"><h2>Y el resto de la parroquia</h2></div><div class="parroquia">${rest.map((r, j) => `<span>${av(r.p)}${esc(r.p.name)} <em>${j+6}.º · ${fmtPts(r.pts)}</em></span>`).join('')}</div></div>` : '';
  const lit = drinks.reduce((a, d) => a + (LITROS[d.t] || 0), 0), nDr = drinks.filter(d => d.t !== 'agua').length;
  const bill = nDr ? `<div class="sec"><div class="tab-bill"><h3>La cuenta del tabernero</h3>
      ${DRINKS.map(d => [d, drinks.filter(x => x.t === d.k).length]).filter(x => x[1]).map(([d, n]) => `<div class="ln"><span>${n} × ${esc(d.n)}</span><span>${fmtPts(n * d.pts)} pts</span></div>`).join('')}
      <div class="ln tot"><span>TOTAL</span><span>${fmtPts(ptsOf(drinks))} pts</span></div>
      <div class="fn">Unos ${fmtPts(lit)} litros entre todos${lit >= 1.5 ? `: ${fmtPts(lit / 1.5)} botellas de agua de las grandes, pero sin agua` : ''}. Gracias por su visita.</div></div></div>` : '';
  return {barrels, sayings, plaques, parroquia, bill};
}

  const box = $('#avModal'); box.hidden = false;

          <button type="button" data-s="soltero" aria-pressed="${st === 'soltero'}">Soltero/a<span>Lío +20 · Koito +10</span></button>
          <button type="button" data-s="pareja" aria-pressed="${st === 'pareja'}">En pareja<span>Asistencia +25</span></button>
        </div></div>
      <div style="display:grid;gap:8px"><span class="lbl">Tu careto · se cambia al momento</span><div class="picker" id="avPicker"></div></div>
      <div class="err" id="pfErr" role="alert"></div>
      <div class="row prof-extra"><button class="seg" id="pfSwitch">No soy yo: cambiar de persona</button><button class="seg" id="pfTuto">Ver el tutorial</button></div>
    </div>
    <div class="tfoot"><button class="btn sm ghost" id="pfCancel">Cancelar</button><button class="btn sm" id="avSave">Guardar cambios</button></div></div>`;
  const prev = () => { $('#avPrev').innerHTML = av({emoji:pick}); };
  const saveCareto = async (v, isPhoto) => {
    pick = v; prev();
    if (!canWrite()) return;
    try { await db.collection('people').doc(me).update({emoji:v}); p.emoji = v; render(); toast(isPhoto ? '¡Foto de perfil cambiada!' : 'Careto cambiado.'); }
    catch(e){ $('#pfErr').textContent = writeErrMsg(e); }
  };
  bindPicker($('#avPicker'), pick, saveCareto); prev();
  $('#pfName').oninput = e => { $('#pfTitle').textContent = e.target.value.trim() || '¿?'; };
  $('#pfStatus').querySelectorAll('button').forEach(b => b.onclick = () => { st = b.dataset.s; $('#pfStatus').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#avClose').onclick = $('#pfCancel').onclick = closeAv;
  box.onclick = e => { if (e.target === box) closeAv(); };
  $('#pfSwitch').onclick = () => { closeAv(); show('who'); renderWho(); };
  $('#pfTuto').onclick = () => { closeAv(); openTuto(); };
  $('#avSave').onclick = async () => {
    const name = $('#pfName').value.trim(); const err = $('#pfErr');
    if (!name){ err.textContent = 'Ponte un nombre, aunque sea un mote.'; return; }
    if (people.some(o => o.id !== me && o.name.toLowerCase() === name.toLowerCase())){ err.textContent = 'Ese nombre ya lo tiene otro. Elige otro.'; return; }
    const changes = {};
    if (name !== p.name) changes.name = name;
    if (pick !== p.emoji) changes.emoji = pick;
    if (st && st !== p.status) changes.status = st;
    if (!Object.keys(changes).length){ closeAv(); return; }
    if (!canWrite()) return;
    const btn = $('#avSave'); btn.disabled = true;
    try {
      await db.collection('people').doc(me).update(changes); Object.assign(p, changes); closeAv(); render();
      toast(changes.emoji ? rand(['Perfil actualizado. Estás guapísimo.','Nueva cara, misma resaca.']) : changes.name ? `Ahora eres ${name}. Bonito nombre.` : 'Perfil actualizado.');
    } catch(e){ btn.disabled = false; err.textContent = writeErrMsg(e); }
  };
  setTimeout(() => $('#pfName')?.focus({preventScroll:true}), 50);
}

      <div class="t-prof">${['Foto haciendo el tonto','Nombre o mote','Soltero/a o en pareja'].map((x,i) => `<span style="animation-delay:${300 + i*180}ms">✓ ${x}</span>`).join('')}</div>
    </div><span class="t-finger" style="right:calc(50% - 90px);bottom:auto;top:58px" aria-hidden="true">👆</span></div>`;
  if (k === 'casino') return `<div class="till" style="background:radial-gradient(ellipse at 50% 40%,#1F7A4C,#0A3A22 75%)"><div style="display:flex;gap:10px;align-items:center"><div style="width:52px;transform:rotate(-14deg)">${DIE_SVG}</div><div class="cards" style="min-height:0">${cardHtml({r:'A',s:'♠',red:0})}${cardHtml({r:'K',s:'♥',red:1})}</div></div></div>`;
  if (k === 'tabernia') return `<div class="till" style="background:radial-gradient(ellipse at 50% 50%,rgba(201,162,74,.2),transparent 70%),#100E12"><div class="t-scroll"><span class="seal" style="--rk:#D9A21B"><b>8,7</b></span><span style="display:grid;gap:2px;text-align:left"><b style="font-family:'Cinzel Decorative',Georgia,serif;font-size:15px">La Taberna del Pirata</b><i style="font-family:'IM Fell English',Georgia,serif;color:#8A5E00">Legendaria</i><small>5 notas · 7 visitas</small></span></div></div>`;
  if (k === 'fotos') return `<div class="till"><div style="width:130px;transform:rotate(-5deg)"><div class="frame f-polaroid" style="cursor:default"><span class="ph" style="display:grid;place-items:center;font-size:54px;background:#2B3C34">${emo}</span><span class="fcap">Esto no pasó.</span></div></div></div>`;
  return `<div class="till neon"><div class="t-sign"><span class="el">EL</span><span class="bd">BU<span class="flick">R</span>DEL</span></div></div>`;
}
function renderTuto(dir){
  const s = TUTO[tutoI]; const last = tutoI === TUTO.length - 1;
  const box = $('#tuto');
  box.innerHTML = `<div class="tcard">
    <div class="ttop"><span class="tstep">${tutoI + 1} / ${TUTO.length}</span>${last ? '' : '<button class="tskip" id="tSkip">Saltar</button>'}</div>
    <div class="tslide ${dir < 0 ? 'back' : ''}">
      ${tutoIll(s.ill)}
      <div class="tbody">${s.tab ? `<span class="ttab">${document.querySelector(`.tab[data-v="${s.tab}"] svg`)?.outerHTML || ''} Pestaña ${esc(document.querySelector(`.tab[data-v="${s.tab}"] span`)?.textContent || '')}</span>` : ''}<h2 id="tutoTitle">${esc(s.t)}</h2><p>${esc(s.p)}</p><div class="joke">${esc(s.joke)}</div></div>
    </div>
    <div class="tfoot">
      <div class="tdots" aria-hidden="true">${TUTO.map((_,i) => `<i class="${i === tutoI ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tnav">${tutoI ? '<button class="btn sm ghost" id="tPrev">Atrás</button>' : ''}<button class="btn sm" id="tNext">${last ? '¡A la barra!' : tutoI ? 'Siguiente' : 'Vamos'}</button></div>
    </div></div>`;
  $('#tNext').onclick = () => last ? closeTuto() : goTuto(1);
  const pv = $('#tPrev'); if (pv) pv.onclick = () => goTuto(-1);
  const sk = $('#tSkip'); if (sk) sk.onclick = closeTuto;
  clearInterval(tutoTick);
  if (s.ill === 'stepper'){ let n = 1; tutoTick = setInterval(() => { const c = $('#tCount'); if (!c) return; n = n >= 5 ? 1 : n + 1; c.textContent = n; c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }, 900); }
  $('#tNext').focus({preventScroll:true});
}
function goTuto(d){ const n = tutoI + d; if (n < 0 || n >= TUTO.length) return; tutoI = n; renderTuto(d); }
function openTuto(){ tutoI = 0; $('#tuto').hidden = false; renderTuto(1); }
function closeTuto(){
  clearInterval(tutoTick); $('#tuto').hidden = true;
  if (me) store.set('ronda_tuto_' + me, '1');
  toast(rand(['Ya sabes todo. Ahora, a beber con cabeza.','Lección aprendida. Que empiece la ronda.','Tutorial superado. Te has ganado una caña.']));
}
(() => {
  const box = $('#tuto'); let x0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  box.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) goTuto(dx < 0 ? 1 : -1); });
  box.addEventListener('click', e => { if (e.target === box) closeTuto(); });
  document.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowRight') goTuto(1); else if (e.key === 'ArrowLeft') goTuto(-1); else if (e.key === 'Escape') closeTuto();
  });
})();

/* ================= BOOT ================= */
if (store.get('ronda_ok') === '1'){ if (me){ show('app'); render(); } else { show('who'); renderWho(); } }
else show('gate');
})();
</script>
