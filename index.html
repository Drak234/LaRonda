// Base de datos: Firebase en la web publicada (GitHub Pages); la de Claude dentro del artifact.
async function connectDb(){
  const cfg = window.RONDA_FIREBASE;
  if (cfg && window.firebase){
    try { if (!firebase.apps.length) firebase.initializeApp(cfg); return firebase.firestore(); } catch(e){ return null; }
  }
  try { return await window.claude?.use?.('db'); } catch(e){ return null; }
}
let readOnly = false;
const RO_MSG = 'Solo tienes permiso para ver La Ronda. Pide a quien te pasó el enlace que te dé permiso para participar.';
async function checkWrite(){
  try { const u = await window.claude?.use?.('user'); const w = u ? await u.can('data.write') : null; if (w === false){ readOnly = true; refresh(); } } catch(e){}
}
function writeErrMsg(err){
  const c = err && err.code;
  if (c === 'invalid_argument' && window.claude && !window.RONDA_FIREBASE){ readOnly = true; setTimeout(refresh, 0); return RO_MSG; }
  if (['permission_denied','permission-denied','not_granted','unauthenticated'].includes(c)) return 'La barra no deja apuntar ahora mismo. Avisa a quien montó La Ronda.';
  if (['quota_exceeded','resource-exhausted'].includes(c)) return 'La barra está llena: se ha alcanzado el límite de datos.';
  return 'No se ha podido guardar. Revisa la conexión y vuelve a intentarlo.';
}
function dbBannerHtml(){
  if (readOnly) return `<div class="banner">${RO_MSG}</div>`;
  return dbState === 'off' ? `<div class="banner">No se puede conectar con la barra compartida. Revisa tu conexión a internet y recarga la página.</div>` : '';
}
function liveMsg(coll, pid, it){
  const p = person(pid); if (!p) return null;
  const who = `${emoTxt(p)} ${p.name}`;
  if (coll === 'nights') return DMAP[it.t] ? `${who} se ha pedido ${DMAP[it.t].art}` : null;
  if (coll === 'fichajes') return PLACES[it.t] && !it.out ? `${who} ha fichado ${PLACES[it.t].en}${it.place ? ' (' + it.place + ')' : ''}` : null;
  if (it.t === 'lio') return `${who} se ha liado con alguien. +20 en El Burdel`;
  if (it.t === 'koito') return `${who} ha practicado el koito. +10 en El Burdel`;
  if (it.t === 'asist'){ const f = person(it.for); return `${who} ha hecho de celestino${f ? ' para ' + f.name : ''}. +25 en El Burdel`; }
  return null;
}
function subscribe(coll){
  db.collection(coll).onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.pid) next[d.id] = {pid:v.pid, night:v.night, items:Array.isArray(v.items) ? v.items : []}; });
    if (!first[coll]){
      snap.docChanges().forEach(ch => {
        if (ch.type === 'removed') return;
        const v = ch.doc.data(); if (!v || v.pid === me || !Array.isArray(v.items)) return;
        const last = v.items[v.items.length-1];
        if (last && last.ts > (seenTs[coll][ch.doc.id] || 0) && Date.now() - last.ts < 180000){ const m = liveMsg(coll, v.pid, last); if (m) toast(m); }
      });
    }
    Object.entries(next).forEach(([id,v]) => { const l = v.items[v.items.length-1]; seenTs[coll][id] = l ? l.ts : 0; });
    first[coll] = false; data[coll] = next; dbState = 'ok'; refresh();
  }, () => { dbState = 'off'; refresh(); });
}
(async () => {
  db = await connectDb();
  if (!db){ dbState = 'off'; refresh(); return; }
  db.collection('people').onSnapshot(snap => {
    people = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(p => p.name);
    dbState = 'ok'; refresh();
  }, () => { dbState = 'off'; refresh(); });
  subscribe('nights'); subscribe('burdel'); subscribe('fichajes'); subscribeFotos();
  if (!window.RONDA_FIREBASE) checkWrite();
  setTimeout(() => { if (dbState === 'connecting'){ dbState = 'off'; refresh(); } }, 12000);
})();
function writeArr(coll, id, items){
  pending[coll][id] = items;
  const [pid, night] = id.split('__');
  const body = {pid, night, items, updatedAt: Date.now()};
  const key = coll + '/' + id;
  const p = (chains[key] || Promise.resolve()).then(() => db.collection(coll).doc(id).set(body));
  chains[key] = p.catch(() => {});
  p.then(() => { if (pending[coll][id] === items) delete pending[coll][id]; })
   .catch(err => { if (pending[coll][id] === items) delete pending[coll][id]; toast(writeErrMsg(err)); refresh(); });
}
const canWrite = () => { if (readOnly){ toast(RO_MSG); return false; } if (!db || dbState !== 'ok'){ toast('Sin conexión con la barra compartida: no se ha apuntado.'); return false; } return true; };

/* ================= ACTIONS ================= */
function addItem(coll, t, extra={}){
  const now = Date.now(); const id = `${me}__${nightKey(now)}`;
  const item = {t, ts:now, ...extra};
  writeArr(coll, id, [...itemsOf(coll, id), item]);
  return {id, item};
}
function removeLast(coll, t){
  if (!canWrite()) return;
  const last = mineTonight(coll).filter(x => x.t === t).pop();
  if (!last) return;
  const id = `${me}__${last.doc}`; const cur = itemsOf(coll, id);
  const removed = cur.find(it => it.ts === last.ts); if (!removed) return;
  writeArr(coll, id, cur.filter(it => it !== removed));
  render(); bumpVal(t);
  const name = coll === 'nights' ? DMAP[t].n.toLowerCase() : BURDEL[t].one;
  toast(`Quitado: 1 ${name}`, {label:'Deshacer', fn:() => restore(coll, id, removed)});
}
function removeItem(coll, doc, ts){
  if (!canWrite()) return;
  const id = `${me}__${doc}`; const cur = itemsOf(coll, id);
  const removed = cur.find(it => it.ts === ts); if (!removed) return;
  writeArr(coll, id, cur.filter(it => it.ts !== ts)); render();
  toast('Quitado del historial', {label:'Deshacer', fn:() => restore(coll, id, removed)});
}
function restore(coll, id, item){
  const cur = itemsOf(coll, id);
  if (cur.some(it => it.ts === item.ts)) return;
  writeArr(coll, id, [...cur, item].sort((a,b) => a.ts - b.ts)); render();
}
function undoAdd(coll, id, ts){
  const cur = itemsOf(coll, id); const items = cur.filter(it => it.ts !== ts);
  if (items.length === cur.length) return;
  writeArr(coll, id, items); render(); toast('Deshecho. Aquí no ha pasado nada.');
}
function addDrink(t, from){
  if (!canWrite()) return;
  const before = ptsOf(mineTonight('nights')); const lvBefore = levelFor(before);
  const {id, item} = addItem('nights', t);
  try { navigator.vibrate && navigator.vibrate(t === 'chupito' ? [20,40,20] : 25); } catch(e){}
  if (from) flyFrom(from, t);
  const after = before + DMAP[t].pts; const lvAfter = levelFor(after);
  render(); bumpVal(t);
  if (lvAfter > lvBefore && after > 0.5) setTimeout(() => stamp(LEVELS[lvAfter][1], 'Nuevo nivel'), 500);
  toast(t === 'agua' ? rand(WATER_CHEERS) : `${rand(CHEERS)} +${fmtPts(DMAP[t].pts)} pts`, {label:'Deshacer', fn:() => undoAdd('nights', id, item.ts)});
}
function addBurdel(t, extra={}){
  if (!canWrite()) return;
  const {id, item} = addItem('burdel', t, extra);
  try { navigator.vibrate && navigator.vibrate([30,50,30,50,60]); } catch(e){}
  render(); bumpVal(t);
  stamp(`+${BURDEL[t].pts}`, rand(B_CHEERS[t]), true);
  toast(`${BURDEL[t].n} · +${BURDEL[t].pts} pts`, {label:'Deshacer', fn:() => undoAdd('burdel', id, item.ts)});
}
function setOut(s, out){
  const id = `${s.pid}__${s.doc || s.night}`;
  writeArr('fichajes', id, itemsOf('fichajes', id).map(it => {
    if (it.ts !== s.ts) return it;
    const n = {...it}; if (out) n.out = out; else delete n.out; return n;
  }));
}
function checkIn(t){
  if (!canWrite()) return;
  const place = ($('#placeName')?.value || '').trim().slice(0, 40);
  const open = openSession(me);
  const outAt = Date.now();
  if (open) setOut(open, outAt);
  addItem('fichajes', t, place ? {place} : {});
  if (open) setTimeout(() => askRating({...open, out:outAt}), 1700);
  try { navigator.vibrate && navigator.vibrate([40,60,40]); } catch(e){}
  render();
  stamp(t === 'disco' ? 'A la pista' : 'Dentro', open ? `Sales ${PLACES[open.t].de} y fichas` : 'Fichado', t === 'disco');
}
function checkOut(at){
  if (!canWrite()) return;
  const s = openSession(me); if (!s) return;
  const out = Math.max(s.ts + 60000, Math.min(at, Date.now()));
  setOut(s, out); render();
  toast(`Desfichado: ${fmtDur(out - s.ts)} ${PLACES[s.t].en}`, {label:'Deshacer', fn:() => { setOut(s, null); render(); }});
  setTimeout(() => askRating({...s, out}), 350);
}
function checkOutAt(hhmm){
  const s = openSession(me); if (!s || !/^\d{1,2}:\d{2}$/.test(hhmm)) { toast('Pon una hora válida, por ejemplo 04:30.'); return; }
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(s.ts); d.setHours(h, m, 0, 0);
  if (d.getTime() <= s.ts) d.setDate(d.getDate() + 1);
  if (d.getTime() > Date.now()){ toast('Esa hora todavía no ha llegado.'); return; }
  checkOut(d.getTime());
}
function bumpVal(t){ const v = document.querySelector(`.stepper[data-k="${t}"] .val`); if (v){ v.classList.remove('pulse'); void v.offsetWidth; v.classList.add('pulse'); } }
function flyFrom(btn, t){
  const glass = $('#glass'); if (!glass) return;
  const a = (btn.querySelector('.ic') || btn).getBoundingClientRect(); const b = glass.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'fly'; el.style.background = DMAP[t].hi; el.innerHTML = svgI(t);
  el.style.left = a.left + 'px'; el.style.top = a.top + 'px'; document.body.appendChild(el);
  const dx = b.left + b.width/2 - a.left - 20, dy = b.top + b.height*0.35 - a.top - 20;
  const anim = el.animate([
    {transform:'translate(0,0) scale(1) rotate(0)', opacity:1},
    {transform:`translate(${dx*0.5}px,${dy*0.5 - 90}px) scale(1.3) rotate(-25deg)`, opacity:1, offset:.5},
    {transform:`translate(${dx}px,${dy}px) scale(.4) rotate(20deg)`, opacity:.2}
  ], {duration:650, easing:'cubic-bezier(.4,0,.6,1)'});
  anim.onfinish = () => { el.remove(); const g = $('#glass'); if (g){ g.classList.remove('bump'); void g.getBoundingClientRect(); g.classList.add('bump'); } };
}

/* ================= TOAST / STAMP ================= */
function toast(msg, action){
  const box = $('#toasts');
  while (box.children.length > 2) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast';
  const s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 300); };
  if (action){ const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); kill(); }; t.appendChild(b); }
  box.appendChild(t);
  setTimeout(kill, action ? 5000 : 3200);
}
function stamp(txt, small, neon){
  const s = $('#stamp'); s.hidden = false;
  s.innerHTML = `<div class="${neon ? 'neonst' : ''}"><small>${esc(small)}</small>${esc(txt)}</div>`;
  clearTimeout(stamp._t); stamp._t = setTimeout(() => { s.hidden = true; }, 1950);
}

function nightSummary(list){
  const alc = list.filter(d => d.t !== 'agua');
  const ts = alc.map(d => d.ts);
  return {pts:ptsOf(alc), n:alc.length, agua:list.length - alc.length, first:Math.min(...ts), last:Math.max(...ts),
    counts:Object.fromEntries(DRINKS.map(d => [d.k, alc.filter(x => x.t === d.k).length]))};
}

function compressPhoto(img){
  let side = 900, q = .82, url = '';
  for (let tries = 0; tries < 8; tries++){
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    url = c.toDataURL('image/jpeg', q);
    if (url.length < 190000) return url;
    if (q > .55) q -= .1; else side = Math.round(side * .8);
  }
  return url;
}

function hashStr(t){ let h = 2166136261; for (let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function frasesAsignadas(){
  // Cada persona recibe una frase fija, sin repetir dentro de la cuadrilla (por orden de llegada).
  const out = {}, used = new Set();
  [...people].sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id)).forEach(p => {
    let i = hashStr(p.id) % FRASES.length, n = 0;
    while (used.has(i) && n < FRASES.length){ i = (i + 1) % FRASES.length; n++; }
    used.add(i); out[p.id] = FRASES[i];
  });
  return out;
}

const CROWN = `<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z" fill="#F2B33D" stroke="#7A5005" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const periodFilter = r => { const nowK = tonightKey(); return {night: d => d.night === nowK, month: d => d.night.slice(0,7) === nowK.slice(0,7), all: () => true}[r]; };

        ${rows.length ? `<div class="podium">${pod.map((r,i) => { const place = [2,1,3][i]; if (!r) return `<div class="pod p${place}"></div>`;
          return `<div class="pod p${place}"><div class="av">${place===1 ? CROWN : ''}${av(r.p)}</div><div class="pn">${esc(r.p.name)}</div><div class="pp">${fmtPts(r.pts)} pts</div><div class="block">${place}</div></div>`; }).join('')}</div>`
        : `<p class="empty" style="font-family:var(--font-chalk);font-size:22px;margin-top:18px">${topRange === 'night' ? 'La noche es joven. Aún no ha bebido nadie.' : 'Pizarra en blanco. Que empiece la ronda.'}</p>`}
      </div>

    <div class="sec board" style="padding-block:18px 22px">

  el.querySelectorAll('.seg').forEach(b => b.onclick = () => { topRange = b.dataset.r; render(); });

      </div>
    </div>`;
  el.querySelectorAll('.status button').forEach(b => b.onclick = () => { if (status !== b.dataset.s){ assistOpen = false; setStatus(b.dataset.s); } });
  el.querySelectorAll('.act-add, .act .plus').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'asist'){ if (!canWrite()) return; assistOpen = true; render(); document.querySelector('.assist-pick')?.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    addBurdel(k);
  });
  el.querySelectorAll('.act .minus').forEach(b => b.onclick = () => removeLast('burdel', b.dataset.k));
  el.querySelectorAll('.assist-pick .opts button').forEach(b => b.onclick = () => { assistOpen = false; addBurdel('asist', b.dataset.for ? {for:b.dataset.for} : {}); });
  const ac = $('#assistCancel'); if (ac) ac.onclick = () => { assistOpen = false; render(); };
  el.querySelectorAll('.ncard .del').forEach(b => b.onclick = () => removeItem('burdel', b.dataset.n, Number(b.dataset.ts)));
  el.querySelectorAll('.seg[data-r]').forEach(b => b.onclick = () => { burdelRange = b.dataset.r; render(); });
}

/* ================= MI PERFIL ================= */
function openProfile(){
  const p = person(me);
  if (!p){ show('who'); renderWho(); return; }
  let pick = p.emoji || '🍺', st = p.status || null;
  const box = $('#avModal'); box.hidden = false;
  box.innerHTML = `<div class="tcard">
    <div class="ttop"><span class="tstep">Mi perfil</span><button class="tskip" id="avClose">Cerrar</button></div>
    <div class="tbody" style="padding-top:10px;gap:16px">
      <div class="prof-head"><span id="avPrev" class="prof-av"></span><div style="min-width:0"><h2 id="pfTitle">${esc(p.name)}</h2><div class="hint">¿Te equivocaste o ha cambiado algo? Arréglalo aquí.</div></div></div>
      <div style="display:grid;gap:6px"><label class="lbl" for="pfName">Nombre (o mote)</label><input class="txt" id="pfName" maxlength="20" value="${esc(p.name)}"></div>
      <div style="display:grid;gap:8px"><span class="lbl" id="pfStLbl">¿Cómo estás de amores?</span>
        <div class="status" id="pfStatus" role="group" aria-labelledby="pfStLbl">
          <button type="button" data-s="soltero" aria-pressed="${st === 'soltero'}">Soltero/a<span>Lío +20 · Koito +10</span></button>
          <button type="button" data-s="pareja" aria-pressed="${st === 'pareja'}">En pareja<span>Asistencia +25</span></button>
        </div></div>
      <div style="display:grid;gap:8px"><span class="lbl">Tu careto · se cambia al momento</span><div class="picker" id="avPicker"></div></div>
      <div class="err" id="pfErr" role="alert"></div>
      <div class="row prof-extra"><button class="seg" id="pfSwitch">No soy yo: cambiar de persona</button><button class="seg" id="pfTuto">Ver el tutorial</button></div>
    </div>
    <div class="tfoot"><button class="btn sm ghost" id="pfCancel">Cancelar</button><button class="btn sm" id="avSave">Guardar cambios</button></div></div>`;
  const prev = () => { $('#avPrev').innerHTML = av({emoji:pick}); };
  const saveCareto = async (v, isPhoto) => {
    pick = v; prev();
    if (!canWrite()) return;
    try { await db.collection('people').doc(me).update({emoji:v}); p.emoji = v; render(); toast(isPhoto ? '¡Foto de perfil cambiada!' : 'Careto cambiado.'); }
    catch(e){ $('#pfErr').textContent = writeErrMsg(e); }
  };
  bindPicker($('#avPicker'), pick, saveCareto); prev();
  $('#pfName').oninput = e => { $('#pfTitle').textContent = e.target.value.trim() || '¿?'; };
  $('#pfStatus').querySelectorAll('button').forEach(b => b.onclick = () => { st = b.dataset.s; $('#pfStatus').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#avClose').onclick = $('#pfCancel').onclick = closeAv;
  box.onclick = e => { if (e.target === box) closeAv(); };
  $('#pfSwitch').onclick = () => { closeAv(); show('who'); renderWho(); };
  $('#pfTuto').onclick = () => { closeAv(); openTuto(); };
  $('#avSave').onclick = async () => {
    const name = $('#pfName').value.trim(); const err = $('#pfErr');
    if (!name){ err.textContent = 'Ponte un nombre, aunque sea un mote.'; return; }
    if (people.some(o => o.id !== me && o.name.toLowerCase() === name.toLowerCase())){ err.textContent = 'Ese nombre ya lo tiene otro. Elige otro.'; return; }
    const changes = {};
    if (name !== p.name) changes.name = name;
    if (pick !== p.emoji) changes.emoji = pick;
    if (st && st !== p.status) changes.status = st;
    if (!Object.keys(changes).length){ closeAv(); return; }
    if (!canWrite()) return;
    const btn = $('#avSave'); btn.disabled = true;
    try {
      await db.collection('people').doc(me).update(changes); Object.assign(p, changes); closeAv(); render();
      toast(changes.emoji ? rand(['Perfil actualizado. Estás guapísimo.','Nueva cara, misma resaca.']) : changes.name ? `Ahora eres ${name}. Bonito nombre.` : 'Perfil actualizado.');
    } catch(e){ btn.disabled = false; err.textContent = writeErrMsg(e); }
  };
  setTimeout(() => $('#pfName')?.focus({preventScroll:true}), 50);
}
function closeAv(){ const b = $('#avModal'); b.hidden = true; b.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#avModal').hidden) closeAv(); });

/* ================= TUTORIAL ================= */
const TUTO = [
  {ill:'glass',   t:'Bienvenido a La Ronda', p:'La app oficial para contar lo que bebe la cuadrilla. Como Strava, pero con resaca. Abajo tienes las pestañas; te las enseñamos en un momento.', joke:'Son 9 pantallas. Menos que una ronda.'},
  {ill:'stepper', tab:'mine', t:'Apunta lo que bebes', p:'Pides algo, le das al +. Te has colado, le das al −. Tu caña se va llenando y subes de nivel. Cada noche va de 17:00 a 17:00: lo de madrugada cuenta para la noche de antes.', joke:'De "Sobrio como un juez" a "Leyenda del bar". Tú verás.'},
  {ill:'fichar',  tab:'mine', t:'Ficha al entrar', p:'En Mi barra, arriba: fichas al entrar en un bar o en la disco y desfichas al salir. Si cambias de sitio, "Me muevo a la disco". Si se te olvida, pon la hora a mano.', joke:'Como en el curro, pero aquí vas con ganas.'},
  {ill:'points',  tab:'top', t:'Puntos de pedo', p:'Cuanto más fuerte lo que pides, más puntos. El agua no suma. En El top está el ranking de la noche, del mes y de siempre, con premios.', joke:'Pero tu hígado te manda un abrazo.'},
  {ill:'perfil',  tab:'stats', t:'Tú y tus stats', p:'En Mis stats ves tus mejores fiestas, tus horas de bar y tus récords. Toca tu nombre arriba para cambiar la foto, el nombre o si estás soltero o en pareja.', joke:'Si te pusiste un nombre absurdo, aún estás a tiempo.'},
  {ill:'podium',  tab:'group', t:'El grupo', p:'Gráficas de todos, quién está fichado ahora mismo, la crónica con quién hizo qué y a qué hora, y la cuadrilla con la frase de cada uno.', joke:'Spoiler: el problema del grupo eres tú.'},
  {ill:'fotos',   tab:'fotos', t:'Pruebas del Delito', p:'Sube las fotos de la noche con marcos de broma y dales pulgar arriba. Las más votadas suben al podio de la vergüenza.', joke:'Lo que se sube, no se olvida.'},
  {ill:'tabernia', tab:'tabernia', t:'Las Crónicas de Tabernia', p:'Al desfichar, ponle nota del 1 al 10 al bar o a la disco. Aquí ves la media de cada sitio y su rango, de Maldita a Legendaria.', joke:'Que los dioses del vermut nos protejan.'},
  {ill:'neon',    tab:'burdel', t:'El Burdel', p:'Solteros puntúan ligando: +20 el lío y +10 si hay koito. En pareja, ayudando a otro: +25. Si quieres repasar esto, el botón ? de arriba.', joke:'Lo que pasa en el burdel, se queda en el burdel.'}
];
let tutoI = 0, tutoTick = null;
function tutoIll(k){
  const emo = av(person(me));
  if (k === 'glass') return `<div class="till">
    <svg class="t-glass" viewBox="0 0 200 270" aria-hidden="true"><defs><clipPath id="tclip"><path d="M34 22 L166 22 L150 244 Q149 252 141 252 L59 252 Q51 252 50 244 Z"/></clipPath></defs>
      <g clip-path="url(#tclip)"><g class="t-liq"><rect x="0" y="0" width="200" height="300" fill="#F2B33D"/><rect x="0" y="-10" width="200" height="16" rx="8" fill="var(--foam)"/></g></g>
      <path d="M34 22 L166 22 L150 244 Q149 252 141 252 L59 252 Q51 252 50 244 Z" fill="none" stroke="var(--ink)" stroke-opacity=".6" stroke-width="4" stroke-linejoin="round"/></svg>
    <span class="t-emo">${emo}</span></div>`;
  if (k === 'stepper') return `<div class="till"><div class="t-mock">
      <div class="row1"><span class="ic">${svgI('cerveza')}</span><div><b>Cerveza</b><div class="hint" style="font-size:12px">+1 pt</div></div></div>
      <div class="stepper"><button tabindex="-1" aria-hidden="true">−</button><span class="val" id="tCount">1</span><button class="plus tap" tabindex="-1" aria-hidden="true">+</button></div>
    </div><span class="t-finger" aria-hidden="true">👆</span></div>`;
  if (k === 'fichar') return `<div class="till"><div class="fich on disco" style="--fc:#C4A8FF;width:min(260px,86%);padding:14px;gap:6px">
      <div class="live"><span class="pulse-dot"></span><b style="font-size:13.5px">Fichado en la discoteca</b></div>
      <div class="timer" style="font-size:34px" data-since="${Date.now() - 2*3600e3 - 17*60e3}">02:17:00</div>
      <div class="hint" style="font-size:12.5px">Y subiendo…</div></div></div>`;
  if (k === 'points') return `<div class="till"><div class="t-board">
      ${[...DRINKS].sort((a,b) => b.pts - a.pts).map((d,i) => `<div style="animation-delay:${i*80}ms"><span>${esc(d.n)}</span><b>${fmtPts(d.pts)}</b></div>`).join('')}<div style="animation-delay:480ms"><span>Agua</span><b>0</b></div></div></div>`;
  if (k === 'podium') return `<div class="till"><div class="t-pod">
      <div><span>🤷</span><i style="height:60px;background:#C9CDD2;animation-delay:.15s">2</i></div>
      <div><span style="position:relative">${emo}</span><i style="height:96px;background:var(--amber);animation-delay:.35s">1</i></div>
      <div><span>🙈</span><i style="height:44px;background:#C98A55;animation-delay:.5s">3</i></div></div></div>`;
  if (k === 'perfil') return `<div class="till"><div style="display:grid;gap:12px;justify-items:center">
      <div class="me-chip" style="pointer-events:none;font-size:15px"><span class="e">${emo}</span><span class="n">${esc(person(me)?.name || 'Tu nombre')}</span></div>
      <div class="t-prof">${['Foto haciendo el tonto','Nombre o mote','Soltero/a o en pareja'].map((x,i) => `<span style="animation-delay:${300 + i*180}ms">✓ ${x}</span>`).join('')}</div>
    </div><span class="t-finger" style="right:calc(50% - 90px);bottom:auto;top:58px" aria-hidden="true">👆</span></div>`;
  if (k === 'tabernia') return `<div class="till" style="background:radial-gradient(ellipse at 50% 50%,rgba(201,162,74,.2),transparent 70%),#100E12"><div class="t-scroll"><span class="seal" style="--rk:#D9A21B"><b>8,7</b></span><span style="display:grid;gap:2px;text-align:left"><b style="font-family:'Cinzel Decorative',Georgia,serif;font-size:15px">La Taberna del Pirata</b><i style="font-family:'IM Fell English',Georgia,serif;color:#8A5E00">Legendaria</i><small>5 notas · 7 visitas</small></span></div></div>`;
  if (k === 'fotos') return `<div class="till"><div style="width:130px;transform:rotate(-5deg)"><div class="frame f-polaroid" style="cursor:default"><span class="ph" style="display:grid;place-items:center;font-size:54px;background:#2B3C34">${emo}</span><span class="fcap">Esto no pasó.</span></div></div></div>`;
  return `<div class="till neon"><div class="t-sign"><span class="el">EL</span><span class="bd">BU<span class="flick">R</span>DEL</span></div></div>`;
}
function renderTuto(dir){
  const s = TUTO[tutoI]; const last = tutoI === TUTO.length - 1;
  const box = $('#tuto');
  box.innerHTML = `<div class="tcard">
    <div class="ttop"><span class="tstep">${tutoI + 1} / ${TUTO.length}</span>${last ? '' : '<button class="tskip" id="tSkip">Saltar</button>'}</div>
    <div class="tslide ${dir < 0 ? 'back' : ''}">
      ${tutoIll(s.ill)}
      <div class="tbody">${s.tab ? `<span class="ttab">${document.querySelector(`.tab[data-v="${s.tab}"] svg`)?.outerHTML || ''} Pestaña ${esc(document.querySelector(`.tab[data-v="${s.tab}"] span`)?.textContent || '')}</span>` : ''}<h2 id="tutoTitle">${esc(s.t)}</h2><p>${esc(s.p)}</p><div class="joke">${esc(s.joke)}</div></div>
    </div>
    <div class="tfoot">
      <div class="tdots" aria-hidden="true">${TUTO.map((_,i) => `<i class="${i === tutoI ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tnav">${tutoI ? '<button class="btn sm ghost" id="tPrev">Atrás</button>' : ''}<button class="btn sm" id="tNext">${last ? '¡A la barra!' : tutoI ? 'Siguiente' : 'Vamos'}</button></div>
    </div></div>`;
  $('#tNext').onclick = () => last ? closeTuto() : goTuto(1);
  const pv = $('#tPrev'); if (pv) pv.onclick = () => goTuto(-1);
  const sk = $('#tSkip'); if (sk) sk.onclick = closeTuto;
  clearInterval(tutoTick);
  if (s.ill === 'stepper'){ let n = 1; tutoTick = setInterval(() => { const c = $('#tCount'); if (!c) return; n = n >= 5 ? 1 : n + 1; c.textContent = n; c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }, 900); }
  $('#tNext').focus({preventScroll:true});
}
function goTuto(d){ const n = tutoI + d; if (n < 0 || n >= TUTO.length) return; tutoI = n; renderTuto(d); }
function openTuto(){ tutoI = 0; $('#tuto').hidden = false; renderTuto(1); }
function closeTuto(){
  clearInterval(tutoTick); $('#tuto').hidden = true;
  if (me) store.set('ronda_tuto_' + me, '1');
  toast(rand(['Ya sabes todo. Ahora, a beber con cabeza.','Lección aprendida. Que empiece la ronda.','Tutorial superado. Te has ganado una caña.']));
}
(() => {
  const box = $('#tuto'); let x0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
  box.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) goTuto(dx < 0 ? 1 : -1); });
  box.addEventListener('click', e => { if (e.target === box) closeTuto(); });
  document.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowRight') goTuto(1); else if (e.key === 'ArrowLeft') goTuto(-1); else if (e.key === 'Escape') closeTuto();
  });
})();

/* ================= BOOT ================= */
if (store.get('ronda_ok') === '1'){ if (me){ show('app'); render(); } else { show('who'); renderWho(); } }
else show('gate');
})();
</script>
